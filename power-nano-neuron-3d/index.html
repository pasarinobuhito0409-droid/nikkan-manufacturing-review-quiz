<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08121f">
  <meta name="description" content="2026年6月29日の日刊工業新聞から、発電評価、ビヨンド2ナノ、脳神経細胞の回復力を触って学ぶ3D教材。">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>発電評価・ビヨンド2ナノ・脳神経回復 3D教材</title>
</head>
<body>
  <main class="app-shell">
    <section class="scene-shell" aria-label="今日の3D教材">
      <div class="scene-wrap" id="sceneWrap">
        <canvas id="sceneCanvas" aria-label="触れる3D教材"></canvas>

        <header class="hero-copy">
          <a class="back-link" href="../index.html">復習アプリへ</a>
          <p class="eyebrow">日刊工業新聞 2026年6月29日</p>
          <h1>今日の内容を<br>触って理解する</h1>
          <p id="coreLine">発電量（kWh）は、発電の強さ（kW）と時間でたまる量。</p>
        </header>

        <section class="focus-card" aria-live="polite">
          <p class="focus-kicker" id="focusKicker">ステージ 1</p>
          <h2 id="focusTitle">発電評価</h2>
          <p id="focusBody">kW（瞬間の力）を上げると、時間の中でkWh（たまった電力量）が増える。</p>
          <div class="metric-grid">
            <span><strong id="metricA">2.6</strong> <b id="unitA">kW</b></span>
            <span><strong id="metricB">7.8</strong> <b id="unitB">kWh</b></span>
          </div>
        </section>

        <section class="scene-tools" aria-label="3D操作">
          <button type="button" id="rotateButton">回転</button>
          <button type="button" id="zoomInButton">拡大</button>
          <button type="button" id="zoomOutButton">縮小</button>
          <button type="button" id="imageButton">画像を大きく</button>
        </section>
      </div>

      <nav class="station-rail" aria-label="学ぶ内容">
        <button class="station-button active" type="button" data-station="0">
          <span>1</span>
          発電評価
        </button>
        <button class="station-button" type="button" data-station="1">
          <span>2</span>
          ビヨンド2ナノ
        </button>
        <button class="station-button" type="button" data-station="2">
          <span>3</span>
          脳神経回復
        </button>
      </nav>

      <section class="slider-panel" aria-label="触って変える">
        <label for="powerRange" id="rangeLabel">出力と時間</label>
        <input id="powerRange" type="range" min="0" max="100" value="55">
        <output id="rangeValue">55%</output>
      </section>
    </section>

    <aside class="lesson-panel" aria-label="今日の見方">
      <section class="panel-block">
        <p class="panel-kicker">見る順番</p>
        <h2>まず立体を見る</h2>
        <ol>
          <li>ステージを選ぶ。</li>
          <li>スライダーで変化を見る。</li>
          <li>画像を大きくして復習する。</li>
        </ol>
      </section>

      <section class="panel-block dark">
        <p class="panel-kicker">今日の芯</p>
        <h2 id="lessonCore">評価とは、数字にして比べられる状態にすること。</h2>
        <p id="lessonNote">発電は「強さ」だけではなく、安定してどれだけ作れたかを見る。</p>
      </section>

      <section class="image-stack" aria-label="画像復習">
        <button class="image-card active" type="button" data-station="0">
          <img src="./assets/kw-kwh-power-energy.png" alt="kWとkWhのリアル図解">
          <span>kWとkWh</span>
        </button>
        <button class="image-card" type="button" data-station="1">
          <img src="./assets/beyond-2nm-semiconductor.png" alt="ビヨンド2ナノ半導体のリアル図解">
          <span>ビヨンド2ナノ</span>
        </button>
        <button class="image-card" type="button" data-station="2">
          <img src="./assets/neuron-autophagy-recovery.png" alt="脳神経細胞回復のリアル図解">
          <span>脳神経回復</span>
        </button>
      </section>
    </aside>
  </main>

  <dialog class="image-dialog" id="imageDialog">
    <form method="dialog">
      <button class="close-button" type="submit">閉じる</button>
    </form>
    <img id="dialogImage" alt="">
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>

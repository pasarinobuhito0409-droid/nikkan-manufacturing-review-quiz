<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c0d">
  <meta name="description" content="スマホ映像を粒の集まりとして3D化する原理を体験する教材">
  <title>粒を置く。人を消す。</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="lab" id="lab">
    <canvas id="labCanvas" aria-label="工場の配管、圧力計、バルブを粒子で表した3D教材"></canvas>

    <section class="fallback" id="fallback" hidden>
      <strong>3Dを読み込めません。</strong>
      <span>ブラウザを更新して、もう一度試してください。</span>
    </section>

    <header class="header">
      <p class="eyebrow">映像から空間へ</p>
      <h1>粒を置く。<br>人を消す。</h1>
      <p class="lead">細部だけ粒を増やす。</p>
    </header>

    <aside class="readout" aria-live="polite">
      <span class="readout-label">現在の見え方</span>
      <strong id="densityValue">細部 55%</strong>
      <span id="sceneState">細部を保つ</span>
    </aside>

    <section class="control-strip" aria-label="3D教材の操作">
      <div class="control-block">
        <span class="control-label">見る場所</span>
        <div class="segmented" role="group" aria-label="見る場所">
          <button type="button" class="segment is-active" data-mode="density">粒の密度</button>
          <button type="button" class="segment" data-mode="removal">人の除去</button>
        </div>
      </div>

      <div class="control-block mode-panel" id="densityPanel">
        <label class="control-label" for="densityRange">細部の粒 <output id="densityOutput">55%</output></label>
        <input id="densityRange" type="range" min="0" max="100" value="55" step="1">
        <p class="control-note">曲がり・計器・バルブを細かくする。</p>
      </div>

      <div class="control-block mode-panel is-hidden" id="removalPanel">
        <span class="control-label">人の見え方</span>
        <div class="stage-buttons" role="group" aria-label="人の見え方">
          <button type="button" class="stage-button is-active" data-stage="0">写り込み</button>
          <button type="button" class="stage-button" data-stage="1">検出</button>
          <button type="button" class="stage-button" data-stage="2">除去＋補う</button>
        </div>
        <p class="control-note">動く人を除き、別角度で背景を補う。</p>
      </div>

      <button class="reset-button" id="resetButton" type="button" title="最初の状態に戻す" aria-label="最初の状態に戻す">↻</button>
    </section>

    <p class="view-note">ドラッグで視点を動かす</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>

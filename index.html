<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="日刊工業新聞の製造業トピックを増やしながら復習する画像付きPWAクイズ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <title>日刊工業 ものづくり復習アプリ</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #121826;
      --muted: #596579;
      --line: #d9e0ea;
      --blue: #1f66d1;
      --blue-soft: #eaf2ff;
      --green: #148653;
      --green-soft: #e7f7ef;
      --red: #c43d3d;
      --red-soft: #fff0f0;
      --dark: #101827;
      --shadow: 0 10px 30px rgba(16, 24, 39, .10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      line-height: 1.7;
    }

    h1,
    h2,
    h3,
    p,
    li,
    button,
    figcaption,
    .pill {
      overflow-wrap: anywhere;
    }

    main {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 44px;
    }

    header {
      padding: 8px 0 4px;
    }

    .kicker {
      margin: 0 0 6px;
      color: var(--blue);
      font-weight: 800;
      font-size: 15px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 44px);
      line-height: 1.16;
      letter-spacing: 0;
    }

    .lead {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 3.4vw, 19px);
      max-width: 44em;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 16px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .score,
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-weight: 800;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #15447e;
      font-size: 15px;
    }

    .set-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .set-button,
    .reset-button,
    .install-button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
      padding: 9px 12px;
    }

    .set-button {
      min-height: 92px;
      text-align: left;
      box-shadow: var(--shadow);
    }

    .set-button.active {
      border: 2px solid var(--blue);
      background: var(--blue-soft);
    }

    .set-button span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      margin-top: 4px;
    }

    .created-date {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 32px;
      margin: 0 0 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef1f5;
      color: #3f4c60;
      font-size: 15px;
      font-weight: 900;
    }

    .install-button {
      display: none;
      border-color: #244f93;
      background: #12213a;
      color: #fff;
    }

    .install-button.show {
      display: inline-flex;
      align-items: center;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
      align-items: stretch;
      margin: 18px 0;
    }

    .hero-card,
    .quiz-card,
    .finish-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-card img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 260px;
      object-fit: cover;
    }

    .map-card {
      padding: 18px;
    }

    .map-card h2,
    .finish-card h2 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4.5vw, 32px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .route-list {
      display: grid;
      gap: 10px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .route-list li {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      font-size: 17px;
    }

    .quiz-card {
      margin: 18px 0;
      padding: 18px;
    }

    .question-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef1f5;
      color: #3f4c60;
      font-size: 14px;
      font-weight: 800;
    }

    .question {
      margin: 0 0 12px;
      font-size: clamp(22px, 4.8vw, 32px);
      line-height: 1.28;
      letter-spacing: 0;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: clamp(15px, 3vw, 17px);
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      min-height: 58px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 13px 14px;
      text-align: left;
      font: inherit;
      font-size: clamp(17px, 3.6vw, 20px);
      line-height: 1.45;
      cursor: pointer;
    }

    .choice:hover,
    .choice:focus-visible {
      border-color: var(--blue);
      background: var(--blue-soft);
      outline: none;
    }

    .choice.correct {
      border-color: var(--green);
      background: var(--green-soft);
      font-weight: 900;
    }

    .choice.wrong {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .answer {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .answer.show {
      display: block;
    }

    .answer h3 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .answer p {
      margin: 8px 0;
      font-size: clamp(17px, 3.6vw, 20px);
    }

    figure {
      margin: 14px 0 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    figure img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    figcaption {
      padding: 10px 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .finish-card {
      display: none;
      padding: 18px;
      margin-top: 18px;
      background: var(--dark);
      color: #fff;
    }

    .finish-card.show {
      display: block;
    }

    .finish-card p {
      margin: 8px 0 0;
      font-size: 18px;
      color: #d7e1f0;
    }

    @media (max-width: 760px) {
      main {
        width: min(980px, calc(100% - 20px));
        padding-top: 10px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-card img {
        min-height: unset;
        aspect-ratio: 16 / 10;
      }

      .quiz-card,
      .map-card,
      .finish-card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">日刊工業新聞 復習アプリ</p>
      <h1>問題が増える復習棚</h1>
      <p class="lead">
        新しい3問を作るたび、前の問題を消さずに下へ追加する。
      </p>
      <p class="lead">
        スマホで開けば、記事ごとの復習セットを選んで解き直せる。
      </p>
    </header>

    <section class="topbar" aria-live="polite">
      <div class="score">
        <span class="pill" id="setText">セット 1</span>
        <span class="pill" id="scoreText">正解 0 / 3</span>
        <span class="pill" id="totalText">全体 0 / 3</span>
        <span class="pill" id="statusText">まだ回答中</span>
      </div>
      <div class="actions">
        <button class="install-button" id="installButton" type="button">アプリに入れる</button>
        <button class="reset-button" id="resetButton" type="button">このセットをやり直す</button>
      </div>
    </section>

    <nav class="set-list" id="setList" aria-label="復習セット一覧"></nav>

    <section class="hero" aria-label="今回の学習地図">
      <div class="hero-card">
        <img id="heroImage" alt="">
      </div>
      <div class="hero-card map-card">
        <p class="created-date" id="createdDate">作成日：----</p>
        <h2 id="setTitle">今回の芯</h2>
        <ul class="route-list" id="summaryList"></ul>
      </div>
    </section>

    <section id="quizArea" aria-label="問題"></section>

    <section class="finish-card" id="finishCard">
      <h2>このセット完了</h2>
      <p id="finishText"></p>
      <p>新しい問題セットが増えても、この復習棚に残ります。</p>
    </section>
  </main>

  <script src="./quiz-data.js"></script>
  <script>
    const quizSets = window.NIKKAN_QUIZ_SETS || [];
    const setList = document.getElementById("setList");
    const quizArea = document.getElementById("quizArea");
    const setText = document.getElementById("setText");
    const scoreText = document.getElementById("scoreText");
    const totalText = document.getElementById("totalText");
    const statusText = document.getElementById("statusText");
    const heroImage = document.getElementById("heroImage");
    const createdDate = document.getElementById("createdDate");
    const setTitle = document.getElementById("setTitle");
    const summaryList = document.getElementById("summaryList");
    const finishCard = document.getElementById("finishCard");
    const finishText = document.getElementById("finishText");
    const resetButton = document.getElementById("resetButton");
    const installButton = document.getElementById("installButton");
    const storageKey = "nikkan-manufacturing-review-quiz-library-v1";
    let deferredPrompt = null;
    let activeSetId = quizSets[0]?.id || "";
    let state = loadState();

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || { answers: {} };
      } catch {
        return { answers: {} };
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function answerKey(setId, questionId) {
      return `${setId}::${questionId}`;
    }

    function getActiveSet() {
      return quizSets.find((set) => set.id === activeSetId) || quizSets[0];
    }

    function countSet(set) {
      const answered = set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] !== undefined).length;
      const correct = set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] === q.correctIndex).length;
      return { answered, correct, total: set.questions.length };
    }

    function countTotal() {
      return quizSets.reduce((acc, set) => {
        const result = countSet(set);
        acc.correct += result.correct;
        acc.answered += result.answered;
        acc.total += result.total;
        return acc;
      }, { correct: 0, answered: 0, total: 0 });
    }

    function renderSetList() {
      setList.innerHTML = "";
      quizSets.forEach((set, index) => {
        const result = countSet(set);
        const button = document.createElement("button");
        button.className = `set-button${set.id === activeSetId ? " active" : ""}`;
        button.type = "button";
        button.innerHTML = `
          ${index + 1}. ${set.shortTitle || set.title}
          <span>作成日：${set.date} / 正解 ${result.correct} / ${result.total}</span>
        `;
        button.addEventListener("click", () => {
          activeSetId = set.id;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        setList.appendChild(button);
      });
    }

    function renderHero(set) {
      heroImage.src = set.heroImage;
      heroImage.alt = set.heroAlt || set.title;
      createdDate.textContent = `作成日：${set.date}`;
      setTitle.textContent = set.title;
      summaryList.innerHTML = "";
      set.summary.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        summaryList.appendChild(li);
      });
    }

    function renderQuiz(set) {
      quizArea.innerHTML = "";
      set.questions.forEach((q, index) => {
        const key = answerKey(set.id, q.id);
        const saved = state.answers[key];
        const card = document.createElement("article");
        card.className = "quiz-card";
        card.id = key;
        card.innerHTML = `
          <div class="question-meta">
            <span class="tag">第${index + 1}問</span>
            <span class="tag">${q.tag}</span>
          </div>
          <h2 class="question">${q.question}</h2>
          <p class="hint">${q.hint}</p>
          <div class="choices"></div>
          <section class="answer">
            <h3>${q.answerTitle}</h3>
            ${q.answerParagraphs.map((text) => `<p>${text}</p>`).join("")}
            <figure>
              <img src="${q.image}" alt="${q.imageAlt}">
              <figcaption>${q.caption}</figcaption>
            </figure>
          </section>
        `;

        const choices = card.querySelector(".choices");
        q.choices.forEach((choice, choiceIndex) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.type = "button";
          button.textContent = choice;
          button.addEventListener("click", () => {
            if (state.answers[key] !== undefined) return;
            state.answers[key] = choiceIndex;
            saveState();
            applyAnswer(card, q, choiceIndex);
            card.querySelector(".answer").scrollIntoView({ block: "nearest", behavior: "smooth" });
          });
          choices.appendChild(button);
        });

        quizArea.appendChild(card);

        if (Number.isInteger(saved)) {
          applyAnswer(card, q, saved);
        }
      });
    }

    function applyAnswer(card, question, selectedIndex) {
      const buttons = Array.from(card.querySelectorAll(".choice"));
      const answer = card.querySelector(".answer");
      answer.classList.add("show");

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === question.correctIndex) button.classList.add("correct");
        if (index === selectedIndex && index !== question.correctIndex) button.classList.add("wrong");
      });

      updateScore();
      renderSetList();
    }

    function updateScore() {
      const set = getActiveSet();
      const current = countSet(set);
      const total = countTotal();
      const setIndex = quizSets.findIndex((item) => item.id === set.id) + 1;

      setText.textContent = `セット ${setIndex} / ${quizSets.length}`;
      scoreText.textContent = `正解 ${current.correct} / ${current.total}`;
      totalText.textContent = `全体 ${total.correct} / ${total.total}`;
      statusText.textContent = current.answered === current.total ? "このセット完了" : `回答 ${current.answered} / ${current.total}`;
      finishText.textContent = `${set.title} は完了。あとでまた開けば、同じ場所から復習できます。`;
      finishCard.classList.toggle("show", current.answered === current.total);
    }

    function render() {
      const set = getActiveSet();
      renderSetList();
      renderHero(set);
      renderQuiz(set);
      updateScore();
    }

    resetButton.addEventListener("click", () => {
      const set = getActiveSet();
      set.questions.forEach((q) => delete state.answers[answerKey(set.id, q.id)]);
      saveState();
      render();
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.classList.add("show");
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.classList.remove("show");
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }

    render();
  </script>
</body>
</html>

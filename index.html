<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="日刊工業新聞の記事から発明原理を想起・証拠・3Dで復習する精密学習ラボ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <title>発明原理 研究ラボ</title>
  <style>
    :root {
      color-scheme: light;
      --white: #ffffff;
      --aluminum: #f1f4f3;
      --aluminum-2: #e6ebea;
      --graphite: #202625;
      --muted: #65706d;
      --line: #c8d0ce;
      --teal: #19756f;
      --teal-soft: #e2f0ed;
      --red: #b43a3a;
      --red-soft: #fff3f2;
      --green: #327344;
      --green-soft: #eef7ef;
      --amber: #9b6b00;
      --amber-soft: #fff8df;
      --dock-height: 94px;
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--aluminum);
      color: var(--graphite);
      line-height: 1.6;
      overflow: hidden;
    }

    body.viewer-open,
    body.drawer-open { overflow: hidden; }

    button, a { font: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(25, 117, 111, .28);
      outline-offset: 2px;
    }

    button:disabled { cursor: not-allowed; opacity: .42; }

    .app-shell {
      height: 100svh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      background: var(--white);
    }

    .instrument-header {
      min-height: 76px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 10px max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    .icon-button {
      width: 48px;
      height: 48px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--graphite);
      cursor: pointer;
      font-size: 23px;
      line-height: 1;
    }

    .instrument-title { min-width: 0; }

    .instrument-label {
      margin: 0 0 2px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .instrument-title h1 {
      margin: 0;
      font-size: clamp(17px, 2vw, 23px);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .instrument-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .readout {
      min-width: 126px;
      text-align: right;
    }

    .readout strong {
      display: block;
      font-size: 14px;
    }

    .progress-track {
      width: 126px;
      height: 5px;
      margin-top: 6px;
      background: var(--aluminum-2);
      overflow: hidden;
    }

    .progress-track span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--teal);
      transition: width .2s ease;
    }

    .mode-tabs {
      min-height: 50px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
      background: var(--aluminum);
      padding: 0 max(16px, calc((100% - 1040px) / 2));
    }

    .mode-tab {
      min-height: 50px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
    }

    .mode-tab.active {
      border-bottom-color: var(--teal);
      background: var(--white);
      color: var(--teal);
    }

    .learning-stage {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: var(--white);
    }

    .stage-inner {
      width: min(1040px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 26px 28px 42px;
    }

    .calibration-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .calibration-line::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 900;
    }

    .question {
      max-width: 820px;
      margin: 10px 0 8px;
      font-size: clamp(23px, 3.2vw, 38px);
      line-height: 1.35;
    }

    .hint {
      max-width: 760px;
      margin: 0 0 22px;
      color: var(--muted);
      font-weight: 700;
    }

    .choices {
      display: grid;
      gap: 10px;
      max-width: 820px;
    }

    .choice {
      min-height: 54px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--graphite);
      padding: 10px 14px;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
    }

    .choice::before {
      content: attr(data-marker);
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      background: var(--aluminum);
    }

    .choice.selected {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .choice.selected::before { border-color: var(--teal); color: var(--teal); background: var(--white); }
    .choice.correct { border-color: var(--green); background: var(--green-soft); }
    .choice.wrong { border-color: var(--red); background: var(--red-soft); }

    .answer-panel {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 2px solid var(--teal);
    }

    .answer-status {
      margin: 0 0 12px;
      color: var(--green);
      font-weight: 900;
    }

    .answer-status.wrong { color: var(--red); }

    .answer-panel h2 {
      margin: 0 0 18px;
      font-size: clamp(22px, 2.7vw, 32px);
      line-height: 1.35;
    }

    .answer-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, .85fr);
      align-items: start;
      gap: 24px;
    }

    .answer-visual {
      width: 100%;
      min-height: 300px;
      border: 0;
      border-radius: 4px;
      background: var(--aluminum);
      padding: 0;
      overflow: hidden;
      cursor: zoom-in;
    }

    .answer-visual img {
      display: block;
      width: 100%;
      min-height: 300px;
      max-height: 560px;
      object-fit: contain;
      background: var(--aluminum);
    }

    .answer-copy p { margin: 0 0 14px; font-size: 16px; }

    .answer-copy figcaption {
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .evidence-header {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .evidence-header h2 { margin: 5px 0 16px; font-size: clamp(24px, 3vw, 34px); line-height: 1.28; }
    .evidence-header h2 span { display: block; }

    .summary-list { display: grid; gap: 9px; max-width: 780px; margin: 0; padding: 0; list-style: none; }
    .summary-list li { margin: 0; }
    .breath-lines { display: grid; gap: 7px; max-width: 780px; }
    .breath-line { margin: 0; color: var(--muted); line-height: 1.75; }
    .breath-label { display: inline-block; margin-right: .65em; color: var(--ink); font-weight: 900; }

    .hero-image {
      width: 100%;
      max-width: 920px;
      min-height: 420px;
      max-height: 680px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #171916;
    }

    .evidence-band {
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .evidence-band h3 { margin: 0 0 14px; font-size: 20px; }
    .evidence-band.red h3 { color: var(--red); }
    .evidence-band.green h3 { color: var(--green); }
    .evidence-band.amber h3 { color: var(--amber); }

    .evidence-row {
      display: block;
      padding: 16px 0;
      border-top: 1px solid var(--aluminum-2);
    }

    .evidence-row:first-child { border-top: 0; }
    .evidence-row strong { display: block; margin-bottom: 5px; }
    .evidence-row > .breath-lines { margin-top: 8px; }

    .source-button {
      display: block;
      width: 100%;
      max-width: 920px;
      margin-top: 18px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      padding: 4px;
      cursor: zoom-in;
    }

    .source-button img { display: block; width: 100%; height: auto; max-height: 1100px; object-fit: contain; }

    .glossary-list { margin: 0; }
    .glossary-list div { display: grid; grid-template-columns: minmax(150px, .35fr) 1fr; gap: 20px; padding: 13px 0; border-top: 1px solid var(--aluminum-2); }
    .glossary-list dt { font-weight: 900; }
    .glossary-list dd { margin: 0; color: var(--muted); }

    .lab-frame {
      width: 100%;
      height: 100%;
      min-height: 520px;
      display: block;
      border: 0;
      background: var(--white);
    }

    .learning-stage.lab-active { overflow: hidden; }
    .learning-stage.lab-active .stage-inner { width: 100%; height: 100%; padding: 0; }

    .lab-list { max-width: 850px; }
    .lab-list h2 { margin: 0 0 8px; }
    .lab-list > p { margin: 0 0 24px; color: var(--muted); }

    .lab-link {
      min-height: 72px;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      border-top: 1px solid var(--line);
      color: var(--graphite);
      text-decoration: none;
      padding: 12px 4px;
    }

    .lab-link:last-child { border-bottom: 1px solid var(--line); }
    .lab-link strong { display: block; }
    .lab-link span { color: var(--muted); font-size: 14px; }
    .lab-code { color: var(--teal); font-weight: 900; font-size: 13px; }

    .control-dock {
      min-height: var(--dock-height);
      display: grid;
      grid-template-columns: minmax(88px, .55fr) minmax(300px, 1.3fr) minmax(150px, .75fr) minmax(88px, .55fr);
      gap: 12px;
      align-items: center;
      padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--aluminum);
    }

    .dock-button {
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--graphite);
      padding: 8px 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .dock-button.primary { border-color: var(--teal); background: var(--teal); color: var(--white); }

    .confidence-control { min-width: 0; }
    .confidence-control > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 900; }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--white);
    }

    .segment {
      min-height: 44px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .segment:first-child { border-left: 0; }
    .segment.active { background: var(--teal-soft); color: var(--teal); }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      z-index: 30;
      border: 0;
      background: rgba(32, 38, 37, .28);
      cursor: pointer;
    }

    .research-shelf {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 31;
      width: min(390px, 92vw);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--white);
      border-right: 1px solid var(--line);
      transform: translateX(-102%);
      transition: transform .2s ease;
    }

    .research-shelf.open { transform: translateX(0); }

    .shelf-header {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .shelf-header h2 { margin: 0; font-size: 20px; }
    .set-list { overflow: auto; }

    .set-row {
      width: 100%;
      min-height: 70px;
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--white);
      padding: 11px 16px;
      text-align: left;
      cursor: pointer;
    }

    .set-row.active { box-shadow: inset 4px 0 var(--teal); background: var(--teal-soft); }
    .set-row time { color: var(--teal); font-size: 12px; font-weight: 900; }
    .set-row strong { display: block; line-height: 1.35; }
    .set-row small { color: var(--muted); font-weight: 700; }

    .shelf-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
    .install-button { display: none; }
    .install-button.show { display: block; }
    .install-button:not(.show) + #resetButton { grid-column: 1 / -1; }

    .empty-stage { min-height: 300px; display: grid; place-items: center; color: var(--muted); text-align: center; }

    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: rgba(18, 22, 21, .96);
      color: var(--white);
    }

    .image-viewer[hidden], .drawer-scrim[hidden] { display: none; }

    .image-viewer-toolbar {
      min-height: 62px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #56605e;
    }

    .image-viewer-title { margin: 0; font-weight: 900; }
    .image-viewer-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .image-viewer-actions button { min-width: 44px; min-height: 44px; border: 1px solid #76817e; border-radius: 4px; background: #252b2a; color: var(--white); cursor: pointer; }

    .image-viewer-stage { overflow: auto; padding: 16px; text-align: center; }
    .image-viewer-stage img { display: block; max-width: none; height: auto; margin: 0 auto; }
    .image-viewer-caption { max-width: 760px; margin: 14px auto; }

    @media (max-width: 720px) {
      :root { --dock-height: 156px; }
      .instrument-header { min-height: 68px; gap: 9px; padding: 8px 10px; }
      .icon-button { width: 44px; height: 44px; }
      .instrument-label { display: none; }
      .instrument-title h1 { font-size: 16px; }
      .readout { min-width: 74px; }
      .readout strong { font-size: 12px; }
      .progress-track { width: 74px; }
      .mode-tabs { padding: 0; }
      .stage-inner { padding: 20px 16px 34px; }
      .question { font-size: 24px; }
      .answer-layout { grid-template-columns: 1fr; }
      .answer-visual, .answer-visual img { min-height: 220px; }
      .hero-image { min-height: 0; max-height: 520px; }
      .source-button { padding: 2px; }
      .glossary-list div { grid-template-columns: 1fr; gap: 3px; }
      .control-dock {
        grid-template-columns: 74px minmax(0, 1fr) 74px;
        grid-template-rows: 46px 54px;
        gap: 7px;
        padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
      }
      .confidence-control { grid-column: 1 / -1; grid-row: 1; }
      .confidence-control > span { display: none; }
      .segments, .segment { min-height: 44px; }
      #backButton { grid-column: 1; grid-row: 2; }
      #revealButton { grid-column: 2; grid-row: 2; }
      #nextButton { grid-column: 3; grid-row: 2; }
      .dock-button { min-height: 52px; padding: 6px; font-size: 13px; }
      .lab-frame { min-height: 100%; }
      .image-viewer-toolbar { align-items: flex-start; }
      .image-viewer-title { display: none; }
    }

    /* v32: private night invention laboratory */
    :root {
      color-scheme: dark;
      --white: #171a17;
      --aluminum: #10120f;
      --aluminum-2: #242823;
      --graphite: #f1eadb;
      --muted: #afa995;
      --line: rgba(196, 185, 157, .2);
      --teal: #849b62;
      --teal-soft: rgba(47, 73, 52, .52);
      --red: #b96861;
      --red-soft: rgba(91, 29, 31, .58);
      --green: #9bb46c;
      --green-soft: rgba(39, 68, 45, .62);
      --amber: #c9a461;
      --amber-soft: rgba(112, 78, 30, .28);
      --titanium: #b8b2a2;
      --oxblood: #7f292b;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Yu Gothic UI", "Meiryo", serif;
    }

    body {
      background: #0b0d0b;
      color: var(--graphite);
    }

    button, a, .instrument-label, .question-meta, .calibration-line,
    .answer-status, .answer-verdict, .answer-principle, .set-row small {
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    }

    button:focus-visible,
    a:focus-visible { outline-color: rgba(201, 164, 97, .76); }

    .app-shell { background: #10120f; }

    .instrument-header {
      min-height: 88px;
      padding: 14px max(20px, env(safe-area-inset-left));
      border-bottom-color: rgba(201, 164, 97, .25);
      background: rgba(15, 17, 14, .96);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .22);
    }

    .icon-button {
      border-color: rgba(201, 164, 97, .28);
      background: rgba(33, 35, 30, .72);
      color: #d7c29c;
    }

    .instrument-label {
      color: var(--amber);
      font-weight: 700;
      letter-spacing: .12em;
    }

    .instrument-title h1 {
      color: #f1eadb;
      font-weight: 600;
    }

    .instrument-title p,
    .readout strong { color: var(--muted); }

    .progress-track { background: #302d24; }
    .progress-track span { background: var(--green); }

    .mode-tabs {
      min-height: 58px;
      border-bottom-color: rgba(201, 164, 97, .18);
      background: #121411;
    }

    .mode-tab {
      min-height: 58px;
      color: #8f897a;
      font-size: 15px;
      font-weight: 700;
    }

    .mode-tab.active {
      border-bottom-color: var(--amber);
      background: rgba(30, 33, 28, .78);
      color: #e4d3b3;
    }

    .learning-stage {
      background: #111310;
      scrollbar-color: #6f644e #191b17;
    }

    .stage-inner { padding: 42px 36px 64px; }

    .calibration-line {
      margin-bottom: 26px;
      color: #91856e;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .calibration-line::after { background: rgba(201, 164, 97, .26); }

    .question-meta {
      gap: 10px;
      color: #ccb177;
      font-weight: 700;
    }

    .difficulty-label {
      padding: 2px 9px;
      border: 1px solid rgba(132, 155, 98, .56);
      border-radius: 999px;
      background: rgba(39, 68, 45, .32);
      color: #b6c78e;
      font-size: 12px;
    }

    .question {
      margin: 16px 0 12px;
      color: #f4ecdc;
      font-weight: 500;
      letter-spacing: 0;
    }

    .hint { margin-bottom: 30px; color: #aaa28f; font-weight: 500; }
    .choices { gap: 14px; }

    .choice {
      min-height: 62px;
      border-color: rgba(184, 178, 162, .24);
      background: rgba(24, 27, 23, .88);
      color: #e7dece;
      font-weight: 600;
      box-shadow: 0 12px 24px rgba(0, 0, 0, .12);
    }

    .choice:hover:not(:disabled) {
      border-color: rgba(201, 164, 97, .5);
      background: #20221d;
    }

    .choice:disabled { opacity: 1; cursor: default; }

    .choice::before {
      border-color: rgba(201, 164, 97, .38);
      background: #141612;
      color: #c5ae82;
    }

    .choice.selected {
      border-color: #c9a461;
      background: rgba(79, 63, 34, .44);
      box-shadow: inset 3px 0 #c9a461, 0 12px 24px rgba(0, 0, 0, .18);
    }

    .choice.selected::before {
      border-color: #c9a461;
      color: #f0d69f;
      background: #342b1d;
    }

    .choice.correct,
    .choice.selected.correct {
      border-color: #829c58;
      background: rgba(39, 68, 45, .72);
      box-shadow: inset 4px 0 #9bb46c;
    }

    .choice.wrong,
    .choice.selected.wrong {
      border-color: #9b4847;
      background: rgba(91, 29, 31, .76);
      box-shadow: inset 4px 0 #b96861;
    }

    .answer-panel {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(201, 164, 97, .42);
    }

    .answer-status { color: var(--green); }
    .answer-status.wrong { color: #cf7a72; }

    .answer-verdict {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 820px;
      margin-bottom: 12px;
    }

    .answer-verdict p {
      margin: 0;
      padding: 12px 14px;
      border-left: 3px solid var(--green);
      background: rgba(39, 68, 45, .42);
      color: #dce8c5;
    }

    .answer-verdict .selected-wrong {
      border-left-color: #b96861;
      background: rgba(91, 29, 31, .54);
      color: #f0c5bf;
    }

    .answer-verdict span { display: block; color: var(--muted); font-size: 12px; }
    .answer-verdict strong { display: block; margin-top: 3px; }

    .answer-principle {
      max-width: 820px;
      margin: 0 0 22px;
      padding: 10px 14px;
      border-left: 3px solid var(--amber);
      color: #ead8b8;
      background: rgba(112, 78, 30, .2);
      font-weight: 700;
    }

    .answer-panel h2 { color: #f1e5cf; font-weight: 500; }
    .answer-copy p { color: #ddd5c6; }
    .answer-copy figcaption { border-top-color: var(--line); color: #aaa18d; }

    .answer-visual,
    .answer-visual img { background: #0d0f0d; }

    .evidence-header,
    .evidence-band { border-color: rgba(201, 164, 97, .2); }
    .evidence-header h2, .evidence-band h3 { color: #eee3cf; font-weight: 500; }
    .summary-list, .evidence-row p, .glossary-list dd { color: #c8c0b1; }
    .hero-image, .source-button { border-color: rgba(201, 164, 97, .22); }
    .source-button { background: #171916; }

    .lab-frame { background: #0b0d0b; }
    .lab-link { border-color: var(--line); color: #eee4d1; }
    .lab-link span { color: #aaa18d; }
    .lab-code { color: var(--amber); }

    .control-dock {
      border-top-color: rgba(201, 164, 97, .34);
      background: rgba(16, 18, 15, .97);
      box-shadow: 0 -14px 36px rgba(0, 0, 0, .24);
    }

    .dock-button {
      border-color: rgba(184, 178, 162, .24);
      background: #1b1e1a;
      color: #d8cfbf;
    }

    .dock-button.primary {
      border-color: #876c3c;
      background: #425536;
      color: #f6eddc;
    }

    .segments { border-color: rgba(184, 178, 162, .22); background: #171916; }
    .segment { border-left-color: rgba(184, 178, 162, .18); background: #171916; color: #9e9788; }
    .segment.active { background: #534429; color: #f0d9ad; }

    .drawer-scrim { background: rgba(0, 0, 0, .66); }
    .research-shelf { border-right-color: rgba(201, 164, 97, .3); background: #121411; box-shadow: 24px 0 60px rgba(0, 0, 0, .42); }
    .shelf-header, .shelf-tools, .set-row { border-color: var(--line); }
    .set-row { background: #121411; color: #e5dccb; }
    .set-row.active { box-shadow: inset 3px 0 var(--amber); background: #25251e; }
    .set-row time { color: var(--amber); }

    .result-flash {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(7, 8, 7, .82);
      backdrop-filter: blur(10px);
    }

    .result-flash[hidden] { display: none; }

    .result-flash-card {
      width: min(520px, 92vw);
      padding: 42px 28px 36px;
      border: 1px solid rgba(201, 164, 97, .32);
      border-radius: 6px;
      background: rgba(18, 21, 17, .96);
      text-align: center;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
    }

    .result-seal {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 3px double #9bb46c;
      border-radius: 50%;
      color: #b8cf86;
      background: #1f3525;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 72px;
      line-height: 1;
    }

    .result-flash.wrong .result-seal {
      border-color: #b96861;
      color: #e0968e;
      background: #4d1d20;
    }

    .result-flash strong {
      display: block;
      color: #f2eadb;
      font-size: clamp(36px, 8vw, 58px);
      font-weight: 500;
    }

    .result-flash p {
      margin: 10px auto 0;
      color: #c9b997;
      font-size: 16px;
      font-weight: 700;
    }

    .result-flash.playing .result-flash-card { animation: result-arrive .9s ease both; }

    @keyframes result-arrive {
      0% { opacity: 0; transform: scale(.92); }
      22%, 78% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.01); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .result-flash.playing .result-flash-card { animation: none; }
    }

    @media (max-width: 720px) {
      .instrument-header { min-height: 72px; padding: 9px 10px; }
      .mode-tabs, .mode-tab { min-height: 52px; }
      .stage-inner { padding: 28px 16px 44px; }
      .question { font-size: 25px; }
      .choice { min-height: 58px; padding: 10px 12px; }
      .answer-verdict { grid-template-columns: 1fr; }
      .result-flash-card { padding: 34px 20px 30px; }
      .result-seal { width: 96px; height: 96px; font-size: 62px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="instrument-header" aria-live="polite">
      <button class="icon-button" id="shelfOpenButton" type="button" aria-label="研究棚を開く" title="研究棚を開く">☰</button>
      <div class="instrument-title">
        <p class="instrument-label">INVENTOR PRINCIPLE LAB</p>
        <h1 id="activeSetTitle">発明原理 研究ラボ</h1>
        <p id="activeSetDate">作成日：----</p>
      </div>
      <div class="readout">
        <strong id="progressText">0 / 0</strong>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
    </header>

    <nav class="mode-tabs" aria-label="学習モード">
      <button class="mode-tab active" type="button" data-mode="recall" aria-selected="true">想起</button>
      <button class="mode-tab" type="button" data-mode="evidence" aria-selected="false">証拠</button>
      <button class="mode-tab" type="button" data-mode="lab" aria-selected="false">3Dラボ</button>
    </nav>

    <main class="learning-stage" id="learningStage" tabindex="-1">
      <div class="stage-inner" id="stageInner"></div>
    </main>

    <footer class="control-dock" aria-label="問題操作">
      <button class="dock-button" id="backButton" type="button">← 戻る</button>
      <div class="confidence-control" id="confidenceControl">
        <span>自信度</span>
        <div class="segments" role="group" aria-label="自信度">
          <button class="segment" type="button" data-confidence="unsure">自信なし</button>
          <button class="segment" type="button" data-confidence="maybe">たぶん</button>
          <button class="segment" type="button" data-confidence="certain">確実</button>
        </div>
      </div>
      <button class="dock-button primary" id="revealButton" type="button">答えを見る</button>
      <button class="dock-button" id="nextButton" type="button">次へ →</button>
    </footer>
  </div>

  <div class="result-flash" id="resultFlash" role="status" aria-live="assertive" aria-atomic="true" hidden>
    <div class="result-flash-card">
      <span class="result-seal" id="resultFlashMark" aria-hidden="true"></span>
      <strong id="resultFlashText"></strong>
      <p id="resultFlashPrinciple"></p>
    </div>
  </div>

  <button class="drawer-scrim" id="drawerScrim" type="button" aria-label="研究棚を閉じる" hidden></button>
  <aside class="research-shelf" id="researchShelf" aria-label="研究棚" aria-hidden="true">
    <div class="shelf-header">
      <h2>研究棚</h2>
      <button class="icon-button" id="shelfCloseButton" type="button" aria-label="研究棚を閉じる" title="閉じる">×</button>
    </div>
    <nav class="set-list" id="setList" aria-label="復習セット一覧"></nav>
    <div class="shelf-tools">
      <button class="dock-button install-button" id="installButton" type="button">アプリに入れる</button>
      <button class="dock-button" id="resetButton" type="button">セットをリセット</button>
    </div>
  </aside>

  <div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="高画質画像ビューア" hidden>
    <div class="image-viewer-toolbar">
      <p class="image-viewer-title" id="imageViewerTitle">高画質画像</p>
      <div class="image-viewer-actions">
        <button type="button" id="viewerFitButton">全体</button>
        <button type="button" id="viewerActualButton">1倍</button>
        <button type="button" id="viewerZoomOutButton" aria-label="縮小">−</button>
        <button type="button" id="viewerZoomInButton" aria-label="拡大">＋</button>
        <button type="button" id="viewerCloseButton">閉じる</button>
      </div>
    </div>
    <div class="image-viewer-stage" id="imageViewerStage">
      <img id="imageViewerImage" alt="">
      <div class="image-viewer-caption" id="imageViewerCaption"></div>
    </div>
  </div>

  <script src="./quiz-data.js?v=34"></script>
  <script>
    const quizSets = window.NIKKAN_QUIZ_SETS || [];
    const storageKey = "nikkan-manufacturing-review-quiz-library-v2";
    const learningKey = "nikkan-manufacturing-review-quiz-learning-v3";
    const specialApps = [
      { href: "./cheap-tactile-data/", code: "MEMO-01", title: "安い触覚データ", text: "押す力・すべりの触覚データを足す発明メモ" },
      { href: "./co2-floor-3d/", code: "LAB-02", title: "CO2回収から再生床材へ", text: "回収から床材までの流れを触って確認" },
      { href: "./power-nano-neuron-3d/", code: "LAB-03", title: "発電評価・2ナノ先・脳神経回復", text: "3つの立体ステージで原理を復習" },
      { href: "./bci-3d/", code: "LAB-04", title: "脳活動で機器操作", text: "脳・センサー・AI・機器の流れを確認" }
    ];

    const stage = document.getElementById("learningStage");
    const stageInner = document.getElementById("stageInner");
    const activeSetTitle = document.getElementById("activeSetTitle");
    const activeSetDate = document.getElementById("activeSetDate");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const setList = document.getElementById("setList");
    const researchShelf = document.getElementById("researchShelf");
    const drawerScrim = document.getElementById("drawerScrim");
    const shelfOpenButton = document.getElementById("shelfOpenButton");
    const shelfCloseButton = document.getElementById("shelfCloseButton");
    const installButton = document.getElementById("installButton");
    const resetButton = document.getElementById("resetButton");
    const backButton = document.getElementById("backButton");
    const nextButton = document.getElementById("nextButton");
    const revealButton = document.getElementById("revealButton");
    const confidenceControl = document.getElementById("confidenceControl");
    const resultFlash = document.getElementById("resultFlash");
    const resultFlashMark = document.getElementById("resultFlashMark");
    const resultFlashText = document.getElementById("resultFlashText");
    const resultFlashPrinciple = document.getElementById("resultFlashPrinciple");
    const modeTabs = Array.from(document.querySelectorAll(".mode-tab"));
    const confidenceButtons = Array.from(document.querySelectorAll(".segment"));
    const imageViewer = document.getElementById("imageViewer");
    const imageViewerImage = document.getElementById("imageViewerImage");
    const imageViewerTitle = document.getElementById("imageViewerTitle");
    const imageViewerCaption = document.getElementById("imageViewerCaption");
    const imageViewerStage = document.getElementById("imageViewerStage");
    const viewerFitButton = document.getElementById("viewerFitButton");
    const viewerActualButton = document.getElementById("viewerActualButton");
    const viewerZoomOutButton = document.getElementById("viewerZoomOutButton");
    const viewerZoomInButton = document.getElementById("viewerZoomInButton");
    const viewerCloseButton = document.getElementById("viewerCloseButton");

    let state = loadJson(storageKey, { answers: {} });
    if (!state.answers || typeof state.answers !== "object") state.answers = {};
    let learningState = loadJson(learningKey, { records: {} });
    if (!learningState.records || typeof learningState.records !== "object") learningState.records = {};
    let activeSetId = quizSets[quizSets.length - 1]?.id || "";
    let activeQuestionIndex = 0;
    let activeMode = "recall";
    let selectedChoice = null;
    let selectedConfidence = null;
    let answerRevealed = false;
    let questionStartedAt = Date.now();
    let viewerScale = 1;
    let deferredPrompt = null;
    let resultFlashTimer = null;

    function loadJson(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch { return fallback; }
    }

    function saveState() { localStorage.setItem(storageKey, JSON.stringify(state)); }
    function saveLearningState() { localStorage.setItem(learningKey, JSON.stringify(learningState)); }
    function answerKey(setId, questionId) { return `${setId}::${questionId}`; }
    function getActiveSet() { return quizSets.find((set) => set.id === activeSetId) || quizSets[0]; }
    function getActiveSetIndex() { return Math.max(0, quizSets.findIndex((set) => set.id === activeSetId)); }

    function countSet(set) {
      const answered = set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] !== undefined).length;
      const correct = set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] === q.correctIndex).length;
      return { answered, correct, total: set.questions.length };
    }

    function getFirstUnansweredIndex(set) {
      return set.questions.findIndex((q) => state.answers[answerKey(set.id, q.id)] === undefined);
    }

    function resetQuestionSession() {
      const set = getActiveSet();
      const q = set?.questions?.[activeQuestionIndex];
      const saved = q ? state.answers[answerKey(set.id, q.id)] : undefined;
      selectedChoice = Number.isInteger(saved) ? saved : null;
      selectedConfidence = null;
      answerRevealed = Number.isInteger(saved);
      questionStartedAt = Date.now();
    }

    function setActiveSetByIndex(index) {
      const nextIndex = Math.max(0, Math.min(index, quizSets.length - 1));
      const nextSet = quizSets[nextIndex];
      if (!nextSet) return;
      activeSetId = nextSet.id;
      const unanswered = getFirstUnansweredIndex(nextSet);
      activeQuestionIndex = unanswered >= 0 ? unanswered : 0;
      activeMode = "recall";
      resetQuestionSession();
      closeShelf();
      render();
    }

    function setActiveQuestion(index) {
      const set = getActiveSet();
      if (!set?.questions?.length) return;
      activeQuestionIndex = Math.max(0, Math.min(index, set.questions.length - 1));
      resetQuestionSession();
      render();
      stage.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setMode(mode) {
      activeMode = mode;
      render();
      stage.scrollTo({ top: 0, behavior: "smooth" });
    }

    function isQuantumSet(set) {
      if (!set || set.date !== "2026-07-10") return false;
      return /quantum|oxide|lquom|量子/i.test([set.id, set.title, set.shortTitle].filter(Boolean).join(" "));
    }

    function renderHeader(set) {
      const result = countSet(set);
      activeSetTitle.textContent = set.shortTitle || set.title;
      activeSetDate.textContent = `作成日：${set.date} ・ 正解 ${result.correct}/${result.total}`;
      progressText.textContent = `${result.answered} / ${result.total}`;
      progressBar.style.width = `${result.total ? (result.answered / result.total) * 100 : 0}%`;
    }

    function renderSetList() {
      setList.innerHTML = "";
      quizSets.map((set, index) => ({ set, index })).reverse().forEach(({ set, index }) => {
        const result = countSet(set);
        const button = document.createElement("button");
        button.type = "button";
        button.className = `set-row${set.id === activeSetId ? " active" : ""}`;
        button.innerHTML = `<time datetime="${set.date}">${set.date}</time><span><strong>${set.shortTitle || set.title}</strong><small>正解 ${result.correct}/${result.total} ・ 回答 ${result.answered}/${result.total}</small></span>`;
        button.addEventListener("click", () => setActiveSetByIndex(index));
        setList.appendChild(button);
      });
    }

    function renderRecall(set) {
      stage.classList.remove("lab-active");
      stageInner.innerHTML = "";
      if (!set.questions?.length) {
        stageInner.innerHTML = '<div class="empty-stage">この研究セットには問題がありません。</div>';
        return;
      }

      activeQuestionIndex = Math.max(0, Math.min(activeQuestionIndex, set.questions.length - 1));
      const q = set.questions[activeQuestionIndex];
      const key = answerKey(set.id, q.id);
      const article = document.createElement("article");
      article.innerHTML = `
        <div class="calibration-line">RECALL ${String(activeQuestionIndex + 1).padStart(2, "0")} / ${String(set.questions.length).padStart(2, "0")}</div>
        <div class="question-meta"><span>第${activeQuestionIndex + 1}問</span><span>${q.tag || "原理"}</span>${q.difficulty ? `<span class="difficulty-label">${q.difficulty}</span>` : ""}</div>
        <h2 class="question">${q.question}</h2>
        <p class="hint">${q.hint || "答えを見る前に、自分の考えを選ぶ。"}</p>
        <div class="choices" aria-label="選択肢"></div>
      `;

      const choices = article.querySelector(".choices");
      q.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.dataset.marker = String.fromCharCode(65 + index);
        button.textContent = choice;
        if (selectedChoice === index) button.classList.add("selected");
        if (answerRevealed) {
          button.disabled = true;
          if (index === q.correctIndex) button.classList.add("correct");
          if (index === selectedChoice && index !== q.correctIndex) button.classList.add("wrong");
        }
        button.addEventListener("click", () => {
          if (answerRevealed) return;
          selectedChoice = index;
          renderRecall(set);
          updateDock(set);
        });
        choices.appendChild(button);
      });

      if (answerRevealed) {
        const correct = selectedChoice === q.correctIndex;
        const principle = q.principle || q.answerTitle.replace(/^答え[：:]\s*/, "");
        const answer = document.createElement("section");
        answer.className = "answer-panel";
        answer.innerHTML = `
          <p class="answer-status${correct ? "" : " wrong"}">${correct ? "正解！" : "不正解"}</p>
          <div class="answer-verdict">
            <p class="${correct ? "selected-correct" : "selected-wrong"}"><span>選んだ答え</span><strong>${q.choices[selectedChoice]}</strong></p>
            <p class="correct-answer"><span>正しい答え</span><strong>${q.choices[q.correctIndex]}</strong></p>
          </div>
          <p class="answer-principle">なぜ：${principle}</p>
          <h2>${q.answerTitle}</h2>
          <div class="answer-layout">
            <button class="answer-visual" type="button" aria-label="説明画像を高画質で開く"><img src="${q.image}" alt="${q.imageAlt || q.answerTitle}"></button>
            <div class="answer-copy">${renderBreathLines(q.answerParagraphs || [])}<figcaption>${renderBreathLines(q.caption || "")}</figcaption></div>
          </div>
        `;
        answer.querySelector(".answer-visual").addEventListener("click", () => openImageViewer(q.zoomImage || q.image, q.imageAlt || q.answerTitle, q.caption || ""));
        article.appendChild(answer);
      }

      stageInner.appendChild(article);
    }

    function normalizeBreathLines(value, explicitLines) {
      if (Array.isArray(explicitLines) && explicitLines.length) return explicitLines;
      if (Array.isArray(value)) {
        return value.flatMap((item) => typeof item === "string"
          ? item.split(/(?<=[。！？])\s*/).filter(Boolean)
          : [item]);
      }
      if (!value) return [];
      if (typeof value === "object") return [value];
      return String(value).split(/(?<=[。！？])\s*/).filter(Boolean);
    }

    function renderBreathLines(value, explicitLines) {
      const lines = normalizeBreathLines(value, explicitLines);
      return `<div class="breath-lines">${lines.map((line) => {
        const label = typeof line === "object" ? line.label : "";
        const text = typeof line === "object" ? line.text : line;
        return `<p class="breath-line">${label ? `<span class="breath-label">${label}</span>` : ""}${text || ""}</p>`;
      }).join("")}</div>`;
    }

    function addEvidenceBand(parent, tone, heading, items) {
      if (!items.length) return;
      const section = document.createElement("section");
      section.className = `evidence-band ${tone}`;
      section.innerHTML = `<h3>${heading}</h3><div></div>`;
      const list = section.lastElementChild;
      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "evidence-row";
        row.innerHTML = `<strong>${item.title || item.term || ""}</strong>${renderBreathLines(item.text || item.meaning || "", item.breathLines)}`;
        if (item.image) {
          const button = document.createElement("button");
          button.className = "source-button";
          button.type = "button";
          button.setAttribute("aria-label", "証拠画像を高画質で開く");
          button.innerHTML = `<img src="${item.image}" alt="${item.imageAlt || item.title || "証拠画像"}">`;
          button.addEventListener("click", () => openImageViewer(item.zoomImage || item.image, item.imageAlt || item.title || "証拠画像", item.caption || item.text || ""));
          row.appendChild(button);
        }
        list.appendChild(row);
      });
      parent.appendChild(section);
    }

    function renderEvidence(set) {
      stage.classList.remove("lab-active");
      const titleLines = normalizeBreathLines(set.title, set.titleLines);
      stageInner.innerHTML = `
        <section class="evidence-header">
          <div><div class="calibration-line">EVIDENCE FILE</div><h2>${titleLines.map((line) => `<span>${typeof line === "object" ? line.text : line}</span>`).join("")}</h2><ul class="summary-list">${(set.summary || []).map((item) => `<li>${renderBreathLines(item, item && item.breathLines)}</li>`).join("")}</ul></div>
          ${set.heroImage ? `<img class="hero-image" src="${set.heroImage}" alt="${set.heroAlt || set.title}">` : ""}
        </section>
      `;
      addEvidenceBand(stageInner, "red", set.curiosityTitle || "赤：気になる原理", Array.isArray(set.curiosityPoints) ? set.curiosityPoints : []);
      addEvidenceBand(stageInner, "green", set.importantTitle || "緑：重要な原理", Array.isArray(set.importantPoints) ? set.importantPoints : []);

      const glossary = Array.isArray(set.glossary) ? set.glossary : [];
      if (glossary.length) {
        const section = document.createElement("section");
        section.className = "evidence-band amber";
        section.innerHTML = `<h3>${set.glossaryTitle || "黄：読みと意味"}</h3><dl class="glossary-list">${glossary.map((item) => `<div><dt>${item.term}</dt><dd>${renderBreathLines(item.meaning, item.breathLines)}</dd></div>`).join("")}</dl>`;
        stageInner.appendChild(section);
      }
    }

    function renderLab(set) {
      stageInner.innerHTML = "";
      if (isQuantumSet(set)) {
        stage.classList.add("lab-active");
        const iframe = document.createElement("iframe");
        iframe.className = "lab-frame";
        iframe.src = "./quantum-laser-3d/index.html";
        iframe.title = "量子レーザー原理 3Dラボ";
        iframe.loading = "eager";
        stageInner.appendChild(iframe);
        return;
      }

      stage.classList.remove("lab-active");
      const section = document.createElement("section");
      section.className = "lab-list";
      section.innerHTML = '<div class="calibration-line">RELATED LABS</div><h2>関連する発明ラボ</h2><p>このセット専用の3D実験はありません。近い原理を静かな教材一覧から選べます。</p>';
      specialApps.forEach((app) => {
        const link = document.createElement("a");
        link.className = "lab-link";
        link.href = app.href;
        link.innerHTML = `<span class="lab-code">${app.code}</span><span><strong>${app.title}</strong><span>${app.text}</span></span><b aria-hidden="true">→</b>`;
        section.appendChild(link);
      });
      stageInner.appendChild(section);
    }

    function updateDock(set) {
      const inRecall = activeMode === "recall";
      confidenceControl.style.visibility = inRecall && !answerRevealed ? "visible" : "hidden";
      revealButton.style.visibility = inRecall ? "visible" : "hidden";
      confidenceButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.confidence === selectedConfidence);
        button.disabled = !inRecall || answerRevealed;
      });
      revealButton.disabled = !inRecall || answerRevealed || !Number.isInteger(selectedChoice) || !selectedConfidence;
      revealButton.textContent = answerRevealed ? "回答済み" : "答えを見る";
      backButton.disabled = activeQuestionIndex === 0;
      nextButton.disabled = inRecall && !answerRevealed;
      nextButton.textContent = activeQuestionIndex === set.questions.length - 1 ? "先頭へ" : "次へ →";
    }

    function render() {
      const set = getActiveSet();
      if (!set) {
        stageInner.innerHTML = '<div class="empty-stage">研究データを読み込めませんでした。</div>';
        return;
      }
      renderHeader(set);
      renderSetList();
      modeTabs.forEach((button) => {
        const active = button.dataset.mode === activeMode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
      if (activeMode === "recall") renderRecall(set);
      if (activeMode === "evidence") renderEvidence(set);
      if (activeMode === "lab") renderLab(set);
      updateDock(set);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next.toISOString();
    }

    function showResultFlash(correct, principle) {
      window.clearTimeout(resultFlashTimer);
      resultFlash.className = `result-flash ${correct ? "correct" : "wrong"}`;
      resultFlashMark.textContent = correct ? "✓" : "×";
      resultFlashText.textContent = correct ? "正解！" : "不正解";
      resultFlashPrinciple.textContent = principle;
      resultFlash.hidden = false;
      void resultFlash.offsetWidth;
      resultFlash.classList.add("playing");
      resultFlashTimer = window.setTimeout(() => {
        resultFlash.hidden = true;
        resultFlash.classList.remove("playing");
        stage.querySelector(".answer-panel")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }, 900);
    }

    function revealCurrentAnswer() {
      const set = getActiveSet();
      const q = set?.questions?.[activeQuestionIndex];
      if (!q || !Number.isInteger(selectedChoice) || !selectedConfidence || answerRevealed) return;
      const key = answerKey(set.id, q.id);
      const now = new Date();
      const correct = selectedChoice === q.correctIndex;
      const previous = learningState.records[key] || {};
      const previousAttempts = Array.isArray(previous.attempts) ? previous.attempts : [];
      const consecutiveCorrectCount = correct ? (previous.consecutiveCorrectCount || 0) + 1 : 0;
      const intervalDays = correct ? ({ unsure: 1, maybe: 3, certain: 7 }[selectedConfidence] || 1) * Math.max(1, consecutiveCorrectCount) : 1;
      const highConfidenceError = !correct && selectedConfidence === "certain";
      const record = {
        confidence: selectedConfidence,
        responseTimeMs: Math.max(0, Date.now() - questionStartedAt),
        hintUsed: false,
        retrySuccess: Boolean(correct && previous.highConfidenceError),
        lastReviewedDate: now.toISOString(),
        dueDate: addDays(now, intervalDays),
        consecutiveCorrectCount,
        highConfidenceError,
        attempts: previousAttempts.concat({ selectedIndex: selectedChoice, correct, confidence: selectedConfidence, reviewedAt: now.toISOString() }).slice(-12)
      };
      state.answers[key] = selectedChoice;
      learningState.records[key] = record;
      saveState();
      saveLearningState();
      answerRevealed = true;
      render();
      showResultFlash(correct, q.principle || q.answerTitle.replace(/^答え[：:]\s*/, ""));
    }

    function openShelf() {
      researchShelf.classList.add("open");
      researchShelf.setAttribute("aria-hidden", "false");
      drawerScrim.hidden = false;
      document.body.classList.add("drawer-open");
      shelfCloseButton.focus();
    }

    function closeShelf() {
      researchShelf.classList.remove("open");
      researchShelf.setAttribute("aria-hidden", "true");
      drawerScrim.hidden = true;
      document.body.classList.remove("drawer-open");
    }

    function updateViewerScale() {
      const naturalWidth = imageViewerImage.naturalWidth || 1200;
      imageViewerImage.style.width = `${Math.max(320, Math.round(naturalWidth * viewerScale))}px`;
      imageViewerTitle.textContent = `高画質画像 ${Math.round(viewerScale * 100)}%`;
    }

    function fitViewerImage() {
      const naturalWidth = imageViewerImage.naturalWidth || 1200;
      const naturalHeight = imageViewerImage.naturalHeight || 800;
      const fitWidth = (imageViewerStage.clientWidth - 32) / naturalWidth;
      const fitHeight = (imageViewerStage.clientHeight - 70) / naturalHeight;
      viewerScale = Math.max(.18, Math.min(fitWidth, fitHeight, 1));
      updateViewerScale();
      imageViewerStage.scrollTo({ top: 0, left: 0 });
    }

    function openImageViewer(src, alt, caption) {
      viewerScale = 1;
      imageViewerImage.src = src;
      imageViewerImage.alt = alt;
      imageViewerCaption.innerHTML = renderBreathLines(caption || "");
      imageViewer.hidden = false;
      document.body.classList.add("viewer-open");
      imageViewerImage.onload = fitViewerImage;
      updateViewerScale();
      viewerCloseButton.focus();
    }

    function closeImageViewer() {
      imageViewer.hidden = true;
      document.body.classList.remove("viewer-open");
      imageViewerImage.removeAttribute("src");
    }

    shelfOpenButton.addEventListener("click", openShelf);
    shelfCloseButton.addEventListener("click", closeShelf);
    drawerScrim.addEventListener("click", closeShelf);
    modeTabs.forEach((button) => button.addEventListener("click", () => setMode(button.dataset.mode)));
    confidenceButtons.forEach((button) => button.addEventListener("click", () => { selectedConfidence = button.dataset.confidence; updateDock(getActiveSet()); }));
    revealButton.addEventListener("click", revealCurrentAnswer);
    backButton.addEventListener("click", () => setActiveQuestion(activeQuestionIndex - 1));
    nextButton.addEventListener("click", () => {
      const set = getActiveSet();
      const nextIndex = activeQuestionIndex < set.questions.length - 1 ? activeQuestionIndex + 1 : 0;
      setActiveQuestion(nextIndex);
    });

    resetButton.addEventListener("click", () => {
      const set = getActiveSet();
      if (!set || !window.confirm(`「${set.shortTitle || set.title}」の回答と学習記録をリセットしますか？`)) return;
      set.questions.forEach((q) => {
        const key = answerKey(set.id, q.id);
        delete state.answers[key];
        delete learningState.records[key];
      });
      saveState();
      saveLearningState();
      activeQuestionIndex = 0;
      resetQuestionSession();
      closeShelf();
      render();
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.classList.add("show");
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.classList.remove("show");
    });

    viewerFitButton.addEventListener("click", fitViewerImage);
    viewerActualButton.addEventListener("click", () => { viewerScale = 1; updateViewerScale(); });
    viewerZoomOutButton.addEventListener("click", () => { viewerScale = Math.max(.18, viewerScale / 1.35); updateViewerScale(); });
    viewerZoomInButton.addEventListener("click", () => { viewerScale = Math.min(4, viewerScale * 1.35); updateViewerScale(); });
    viewerCloseButton.addEventListener("click", closeImageViewer);
    imageViewer.addEventListener("click", (event) => { if (event.target === imageViewer) closeImageViewer(); });
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!imageViewer.hidden) closeImageViewer();
      else if (researchShelf.classList.contains("open")) closeShelf();
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js?v=34"));
    }

    resetQuestionSession();
    render();
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="日刊工業新聞の記事から発明原理を想起・証拠・3Dで復習する精密学習ラボ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <title>発明原理 研究ラボ</title>
  <style>
    :root {
      color-scheme: light;
      --white: #ffffff;
      --aluminum: #f1f4f3;
      --aluminum-2: #e6ebea;
      --graphite: #202625;
      --muted: #65706d;
      --line: #c8d0ce;
      --teal: #19756f;
      --teal-soft: #e2f0ed;
      --red: #b43a3a;
      --red-soft: #fff3f2;
      --green: #327344;
      --green-soft: #eef7ef;
      --amber: #9b6b00;
      --amber-soft: #fff8df;
      --dock-height: 94px;
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--aluminum);
      color: var(--graphite);
      line-height: 1.6;
      overflow: hidden;
    }

    body.viewer-open,
    body.drawer-open { overflow: hidden; }

    button, a { font: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(25, 117, 111, .28);
      outline-offset: 2px;
    }

    button:disabled { cursor: not-allowed; opacity: .42; }

    .app-shell {
      height: 100svh;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      background: var(--white);
    }

    .instrument-header {
      min-height: 76px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 10px max(16px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    .icon-button {
      width: 48px;
      height: 48px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--graphite);
      cursor: pointer;
      font-size: 23px;
      line-height: 1;
    }

    .instrument-title { min-width: 0; }

    .instrument-label {
      margin: 0 0 2px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .instrument-title h1 {
      margin: 0;
      font-size: clamp(17px, 2vw, 23px);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .instrument-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .readout {
      min-width: 126px;
      text-align: right;
    }

    .readout strong {
      display: block;
      font-size: 14px;
    }

    .progress-track {
      width: 126px;
      height: 5px;
      margin-top: 6px;
      background: var(--aluminum-2);
      overflow: hidden;
    }

    .progress-track span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--teal);
      transition: width .2s ease;
    }

    .mode-tabs {
      min-height: 50px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
      background: var(--aluminum);
      padding: 0 max(16px, calc((100% - 1040px) / 2));
    }

    .mode-tab {
      min-height: 50px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
    }

    .mode-tab.active {
      border-bottom-color: var(--teal);
      background: var(--white);
      color: var(--teal);
    }

    .learning-lens-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      padding: 8px max(16px, calc((100% - 1040px) / 2));
      border-bottom: 1px solid rgba(201, 164, 97, .22);
      background: rgba(17, 19, 16, .9);
    }

    .learning-lens {
      min-width: 0;
      padding: 8px 12px;
      border-left: 1px solid rgba(201, 164, 97, .18);
      color: #aaa18d;
    }

    .learning-lens:first-child { border-left: 0; }
    .learning-lens strong { display: block; color: #d7c29c; font-size: 14px; }
    .learning-lens span { display: block; margin-top: 2px; font-size: 12px; line-height: 1.45; }
    .learning-lens.active { background: rgba(79, 63, 34, .5); color: #eee3cf; }
    .learning-lens.active strong { color: #f0d9ad; }

    .learning-stage {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: var(--white);
    }

    .stage-inner {
      width: min(1040px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 26px 28px 42px;
    }

    .calibration-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .calibration-line::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 900;
    }

    .question {
      max-width: 820px;
      margin: 10px 0 8px;
      font-size: clamp(23px, 3.2vw, 38px);
      line-height: 1.35;
    }

    .recall-scenario {
      max-width: 820px;
      margin: 22px 0 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--gold);
      background: var(--aluminum);
    }

    .recall-scenario .breath-lines { gap: 6px; }
    .recall-scenario .breath-line { line-height: 1.55; }

    .hint {
      max-width: 760px;
      margin: 0 0 22px;
      color: var(--muted);
      font-weight: 700;
    }

    .choices {
      display: grid;
      gap: 10px;
      max-width: 820px;
    }

    .choice {
      min-height: 54px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--graphite);
      padding: 10px 14px;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
    }

    .choice::before {
      content: attr(data-marker);
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      background: var(--aluminum);
    }

    .choice.selected {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .choice.selected::before { border-color: var(--teal); color: var(--teal); background: var(--white); }
    .choice.correct { border-color: var(--green); background: var(--green-soft); }
    .choice.wrong { border-color: var(--red); background: var(--red-soft); }

    .choice.say-it-choice { min-height: 64px; font-size: 18px; }
    .choice.say-it-choice.said { border-color: var(--green); background: var(--green-soft); }
    .choice.say-it-choice.not-said { border-color: var(--red); background: var(--red-soft); }

    .say-it-summary {
      max-width: 820px;
      margin: 34px 0 12px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--aluminum);
    }

    .say-it-summary h2,
    .say-it-summary h3 { margin: 0 0 12px; }
    .say-it-summary h3 { margin-top: 22px; font-size: 17px; }
    .say-it-score { margin: 0; color: var(--teal); font-size: 24px; font-weight: 900; }
    .say-it-missed { margin: 0; padding-left: 1.5em; }
    .say-it-missed li { margin: 0 0 9px; }
    .say-it-copy-label { display: block; margin: 22px 0 7px; font-weight: 900; }
    .say-it-copy {
      width: 100%;
      min-height: 132px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      color: var(--graphite);
      padding: 10px;
      line-height: 1.7;
      resize: vertical;
    }
    .say-it-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .say-it-copy-status { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); font-size: 13px; }

    .answer-panel {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 2px solid var(--teal);
    }

    .answer-status {
      margin: 0 0 12px;
      color: var(--green);
      font-weight: 900;
    }

    .answer-status.wrong { color: var(--red); }

    .answer-panel h2 {
      margin: 0 0 18px;
      font-size: clamp(22px, 2.7vw, 32px);
      line-height: 1.35;
    }

    .answer-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, .85fr);
      align-items: start;
      gap: 24px;
    }

    .answer-visual {
      width: 100%;
      min-height: 300px;
      border: 0;
      border-radius: 4px;
      background: var(--aluminum);
      padding: 0;
      overflow: hidden;
      cursor: zoom-in;
    }

    .answer-visual img {
      display: block;
      width: 100%;
      min-height: 300px;
      max-height: 560px;
      object-fit: contain;
      background: var(--aluminum);
    }

    .answer-copy p { margin: 0 0 14px; font-size: 16px; }

    .answer-copy figcaption {
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .paper-theater {
      width: 100%;
      max-width: 920px;
      margin: 0 0 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .paper-theater-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .paper-theater-kicker {
      display: block;
      margin-bottom: 4px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .paper-theater-phase {
      margin: 0;
      color: var(--graphite);
      font-size: 22px;
      line-height: 1.3;
    }

    .paper-theater-counter {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .paper-theater-figure { margin: 0; }

    .paper-theater-image {
      display: block;
      width: 100%;
      height: auto;
      min-height: 320px;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--aluminum);
      padding: 8px;
      cursor: zoom-in;
    }

    .paper-theater-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .paper-theater-caption {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.65;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .paper-theater-labels {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      border: 0;
      white-space: nowrap;
    }

    .paper-theater-controls {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) auto minmax(110px, 1fr);
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .paper-theater-controls button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      color: var(--graphite);
      font-weight: 900;
      cursor: pointer;
    }

    .paper-theater-controls button:last-child { justify-self: end; }

    .paper-theater-controls button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .paper-theater-position {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
    }

    .answer-layout--paper { display: block; }
    .answer-copy--below { max-width: 920px; }
    .evidence-row.has-paper-theater { display: block; }
    .evidence-row.has-paper-theater > .breath-lines { max-width: 920px; margin-top: 18px; }

    .evidence-header {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .evidence-header h2 { margin: 5px 0 16px; font-size: clamp(24px, 3vw, 34px); line-height: 1.28; }
    .evidence-header h2 span { display: block; }

    .summary-list { display: grid; gap: 9px; max-width: 780px; margin: 0; padding: 0; list-style: none; }
    .summary-list li { margin: 0; }
    .breath-lines { display: grid; gap: 13px; max-width: 780px; }
    .breath-line { margin: 0; color: var(--muted); line-height: 1.75; }
    .breath-label { display: inline-block; margin-right: .65em; color: var(--ink); font-weight: 900; }

    .hero-image {
      width: 100%;
      max-width: 920px;
      min-height: 420px;
      max-height: 680px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #171916;
    }

    .evidence-band {
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .evidence-band h3 { margin: 0 0 14px; font-size: 20px; }
    .evidence-band.red h3 { color: var(--red); }
    .evidence-band.green h3 { color: var(--green); }
    .evidence-band.amber h3 { color: var(--amber); }

    .evidence-row {
      display: block;
      padding: 30px 0 34px;
      border-top: 1px solid var(--aluminum-2);
    }

    .evidence-row:first-child { border-top: 0; }
    .evidence-row strong { display: block; margin-bottom: 18px; }
    .evidence-row > .breath-lines { margin-top: 26px; }

    .evidence-visual {
      width: 100%;
      max-width: 920px;
      margin: 22px 0 0;
    }

    .evidence-visual + .breath-lines { margin-top: 30px; }

    .evidence-visual-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 900;
    }

    .evidence-visual figcaption {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .source-button {
      display: block;
      width: 100%;
      margin: 0;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      padding: 4px;
      cursor: zoom-in;
    }

    .source-button img { display: block; width: 100%; height: auto; max-height: 1100px; object-fit: contain; }

    .teaching-button img { display: block; width: 100%; height: auto; max-height: 780px; object-fit: contain; }

    .glossary-list { margin: 0; }
    .glossary-list div { display: grid; grid-template-columns: minmax(150px, .35fr) 1fr; gap: 20px; padding: 13px 0; border-top: 1px solid var(--aluminum-2); }
    .glossary-list dt { font-weight: 900; }
    .glossary-list dd { margin: 0; color: var(--muted); }

    .lab-frame {
      width: 100%;
      height: 100%;
      min-height: 520px;
      display: block;
      border: 0;
      background: var(--white);
    }

    .learning-stage.lab-active { overflow: hidden; }
    .learning-stage.lab-active .stage-inner { width: 100%; height: 100%; padding: 0; }
    .app-shell.lab-mode { grid-template-rows: auto auto auto minmax(0, 1fr); }
    .app-shell.lab-mode .control-dock { display: none; }

    .lab-list { max-width: 850px; }
    .lab-list h2 { margin: 0 0 8px; }
    .lab-list > p { margin: 0 0 24px; color: var(--muted); }

    .lab-link {
      min-height: 72px;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      border-top: 1px solid var(--line);
      color: var(--graphite);
      text-decoration: none;
      padding: 12px 4px;
    }

    .lab-link:last-child { border-bottom: 1px solid var(--line); }
    .lab-link strong { display: block; }
    .lab-link span { color: var(--muted); font-size: 14px; }
    .lab-code { color: var(--teal); font-weight: 900; font-size: 13px; }

    .control-dock {
      min-height: var(--dock-height);
      display: grid;
      grid-template-columns: minmax(88px, .55fr) minmax(300px, 1.3fr) minmax(150px, .75fr) minmax(88px, .55fr);
      gap: 12px;
      align-items: center;
      padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--aluminum);
    }

    .dock-button {
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--graphite);
      padding: 8px 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .dock-button.primary { border-color: var(--teal); background: var(--teal); color: var(--white); }

    .confidence-control { min-width: 0; }
    .confidence-control > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 900; }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--white);
    }

    .segment {
      min-height: 44px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .segment:first-child { border-left: 0; }
    .segment.active { background: var(--teal-soft); color: var(--teal); }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      z-index: 30;
      border: 0;
      background: rgba(32, 38, 37, .28);
      cursor: pointer;
    }

    .research-shelf {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 31;
      width: min(390px, 92vw);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--white);
      border-right: 1px solid var(--line);
      transform: translateX(-102%);
      transition: transform .2s ease;
    }

    .research-shelf.open { transform: translateX(0); }

    .shelf-header {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .shelf-header h2 { margin: 0; font-size: 20px; }
    .set-list { overflow: auto; }

    .set-row {
      width: 100%;
      min-height: 70px;
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--white);
      padding: 11px 16px;
      text-align: left;
      cursor: pointer;
    }

    .set-row.active { box-shadow: inset 4px 0 var(--teal); background: var(--teal-soft); }
    .set-row time { color: var(--teal); font-size: 12px; font-weight: 900; }
    .set-row strong { display: block; line-height: 1.35; }
    .set-row small { color: var(--muted); font-weight: 700; }

    .shelf-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
    .install-button { display: none; }
    .install-button.show { display: block; }
    .install-button:not(.show) + #resetButton { grid-column: 1 / -1; }

    .empty-stage { min-height: 300px; display: grid; place-items: center; color: var(--muted); text-align: center; }

    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: rgba(18, 22, 21, .96);
      color: var(--white);
    }

    .image-viewer[hidden], .drawer-scrim[hidden] { display: none; }

    .image-viewer-toolbar {
      min-height: 62px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #56605e;
    }

    .image-viewer-title { margin: 0; font-weight: 900; }
    .image-viewer-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .image-viewer-actions button { min-width: 44px; min-height: 44px; border: 1px solid #76817e; border-radius: 4px; background: #252b2a; color: var(--white); cursor: pointer; }

    .image-viewer-stage { overflow: auto; padding: 16px; text-align: center; }
    .image-viewer-stage img { display: block; max-width: none; height: auto; margin: 0 auto; }
    .image-viewer-caption { max-width: 760px; margin: 14px auto; }

    @media (max-width: 720px) {
      :root { --dock-height: 156px; }
      .instrument-header { min-height: 68px; gap: 9px; padding: 8px 10px; }
      .icon-button { width: 44px; height: 44px; }
      .instrument-label { display: none; }
      .instrument-title h1 { font-size: 16px; }
      .readout { min-width: 74px; }
      .readout strong { font-size: 12px; }
      .progress-track { width: 74px; }

    function loadJson(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch { return fallback; }
    }

    function saveState() { localStorage.setItem(storageKey, JSON.stringify(state)); }
    function saveLearningState() { localStorage.setItem(learningKey, JSON.stringify(learningState)); }
    function answerKey(setId, questionId) { return `${setId}::${questionId}`; }
    function getActiveSet() { return quizSets.find((set) => set.id === activeSetId) || quizSets[0]; }
    function getActiveSetIndex() { return Math.max(0, quizSets.findIndex((set) => set.id === activeSetId)); }
    function isSayItSet(set) { return set?.responseMode === "say-it"; }

    function getReviewQuestionIndexes(set) {
      const indexes = set.questions.map((_, index) => index);
      if (!sayItRetryOnly || !isSayItSet(set)) return indexes;
      const missed = indexes.filter((index) => state.answers[answerKey(set.id, set.questions[index].id)] !== 1);
      return missed.length ? missed : indexes;
    }

    function countSet(set) {
      const answered = set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] !== undefined).length;
      const correct = isSayItSet(set)
        ? set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] === 1).length
        : set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] === q.correctIndex).length;
      return { answered, correct, said: isSayItSet(set) ? correct : 0, total: set.questions.length };
    }

    function getFirstUnansweredIndex(set) {
      return set.questions.findIndex((q) => state.answers[answerKey(set.id, q.id)] === undefined);
    }

    function resetQuestionSession() {
      const set = getActiveSet();
      const q = set?.questions?.[activeQuestionIndex];
      const saved = q ? state.answers[answerKey(set.id, q.id)] : undefined;
      selectedChoice = Number.isInteger(saved) ? saved : null;
      selectedConfidence = null;
      answerRevealed = Number.isInteger(saved);
      questionStartedAt = Date.now();
    }

    function setActiveSetByIndex(index) {
      const nextIndex = Math.max(0, Math.min(index, quizSets.length - 1));
      const nextSet = quizSets[nextIndex];
      if (!nextSet) return;
      activeSetId = nextSet.id;
      sayItRetryOnly = false;
      paperFrameIndexes.clear();
      const unanswered = getFirstUnansweredIndex(nextSet);
      activeQuestionIndex = unanswered >= 0 ? unanswered : 0;
      activeMode = "recall";
      resetQuestionSession();
      closeShelf();
      render();
    }

    function setActiveQuestion(index) {
      const set = getActiveSet();
      if (!set?.questions?.length) return;
      const nextIndex = Math.max(0, Math.min(index, set.questions.length - 1));
      const nextQuestion = set.questions[nextIndex];
      if (nextQuestion) paperFrameIndexes.delete(getPaperFrameKey("question", set.id, nextQuestion.id));
      activeQuestionIndex = nextIndex;
      resetQuestionSession();
      render();
      stage.scrollTo({ top: 0, behavior: "smooth" });
    }

      activeMode = mode;
      render();
      stage.scrollTo({ top: 0, behavior: "smooth" });

    function isQuantumSet(set) {
      if (!set || set.date !== "2026-07-10") return false;

      progressText.textContent = `${result.answered} / ${result.total}`;
      progressBar.style.width = `${result.total ? (result.answered / result.total) * 100 : 0}%`;
    }

    function renderSetList() {
      setList.innerHTML = "";
      quizSets.map((set, index) => ({ set, index })).reverse().forEach(({ set, index }) => {
        const result = countSet(set);
        const button = document.createElement("button");
        button.type = "button";
        button.className = `set-row${set.id === activeSetId ? " active" : ""}`;
        const resultLabel = isSayItSet(set) ? `言えた ${result.said}/${result.total}` : `正解 ${result.correct}/${result.total}`;
        button.innerHTML = `<time datetime="${set.date}">${set.date}</time><span><strong>${set.shortTitle || set.title}</strong><small>${resultLabel} ・ 回答 ${result.answered}/${result.total}</small></span>`;

        setList.appendChild(button);
      });

    function renderRecall(set) {

      stageInner.innerHTML = "";
      if (!set.questions?.length) {
        stageInner.innerHTML = '<div class="empty-stage">この研究セットには問題がありません。</div>';
        return;
      }

      const sayIt = isSayItSet(set);

      activeQuestionIndex = Math.max(0, Math.min(activeQuestionIndex, set.questions.length - 1));
      const q = set.questions[activeQuestionIndex];
      const key = answerKey(set.id, q.id);
      const article = document.createElement("article");
      article.innerHTML = `
        <div class="calibration-line">RECALL ${String(activeQuestionIndex + 1).padStart(2, "0")} / ${String(set.questions.length).padStart(2, "0")}</div>
        <div class="question-meta"><span>第${activeQuestionIndex + 1}問</span><span>${q.tag || "原理"}</span>${q.difficulty ? `<span class="difficulty-label">${q.difficulty}</span>` : ""}</div>
        ${q.scenarioLines ? `<div class="recall-scenario">${renderBreathLines(q.scenarioLines)}</div>` : ""}
        <h2 class="question">${q.question}</h2>
        <p class="hint">${q.hint || (sayIt ? "声に出してから、判定を選ぶ。" : "答えを見る前に、自分の考えを選ぶ。")}</p>
        <div class="choices${sayIt ? " say-it-choices" : ""}" aria-label="${sayIt ? "自己判定" : "選択肢"}"></div>

          { label: "言えなかった", value: 0, marker: "×" }
        ]
        : (Array.isArray(q.choices) ? q.choices.map((choice, index) => ({ label: choice, value: index, marker: String.fromCharCode(65 + index) })) : []);
      responseOptions.forEach(({ label, value, marker }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `choice${sayIt ? " say-it-choice" : ""}`;
        button.dataset.marker = marker;
        button.dataset.response = String(value);

        if (selectedChoice === value) button.classList.add("selected");

            if (value === selectedChoice) button.classList.add(value === 1 ? "said" : "not-said");
          } else {
            if (value === q.correctIndex) button.classList.add("correct");
            if (value === selectedChoice && value !== q.correctIndex) button.classList.add("wrong");
          }
        }
        button.addEventListener("click", () => {
          if (answerRevealed) return;
          selectedChoice = value;
          renderRecall(set);
          updateDock(set);
        });
        choices.appendChild(button);
      });

      if (answerRevealed) {
        const said = selectedChoice === 1;

        const principle = q.principle || q.answerTitle.replace(/^答え[：:]\s*/, "");
        const answer = document.createElement("section");
        answer.className = `answer-panel${sayIt ? " answer-panel--say-it" : ""}`;
        const status = sayIt
          ? `<p class="answer-status${said ? "" : " wrong"}">${said ? "言えた" : "言えなかった"}</p>`

        const verdict = sayIt
          ? `<div class="answer-verdict say-it-verdict"><p class="${said ? "selected-correct" : "selected-wrong"}"><span>自己判定</span><strong>${said ? "言えた" : "言えなかった"}</strong></p></div>`
          : `<div class="answer-verdict"><p class="${correct ? "selected-correct" : "selected-wrong"}"><span>選んだ答え</span><strong>${q.choices[selectedChoice]}</strong></p><p class="correct-answer"><span>正しい答え</span><strong>${q.choices[q.correctIndex]}</strong></p></div>`;
        answer.innerHTML = `
          ${status}
          ${verdict}

          <h2>${q.answerTitle}</h2>

          const theater = createPaperTheater({
            frames: q.frames,
            key: getPaperFrameKey("question", set.id, q.id),
            title: q.answerTitle,
            fallbackImage: q.image,
            fallbackZoomImage: q.zoomImage,

          });
          theater.classList.add("answer-paper-theater");
          answer.appendChild(theater);

          copy.className = "answer-copy answer-copy--below";

            <div class="answer-copy">${renderBreathLines(q.answerParagraphs || [])}<figcaption>${renderBreathLines(q.caption || "")}</figcaption></div>
          `;
          layout.querySelector(".answer-visual").addEventListener("click", () => openImageViewer(q.zoomImage || q.image, q.imageAlt || q.answerTitle, q.caption || ""));
          answer.appendChild(layout);

        article.appendChild(answer);
      }

      stageInner.appendChild(article);
      const result = countSet(set);
      if (sayIt && result.answered === result.total) stageInner.appendChild(createSayItSummary(set, result));
    }

    function createSayItSummary(set, result) {
      const missed = set.questions.filter((q) => state.answers[answerKey(set.id, q.id)] === 0);
      const summary = document.createElement("section");
      summary.className = "say-it-summary";
      summary.setAttribute("aria-live", "polite");
      summary.innerHTML = `
        <h2>今回の復習</h2>
        <p class="say-it-score">言えた ${result.said}/${result.total}</p>
        <h3>言えなかった問題</h3>
        <ol class="say-it-missed"></ol>
        <label class="say-it-copy-label" for="sayItCopyText">コピー用テキスト</label>
        <textarea class="say-it-copy" id="sayItCopyText" readonly></textarea>
        <div class="say-it-actions">
          <button class="dock-button" type="button" data-action="copy">コピー</button>
          <button class="dock-button primary" type="button" data-action="retry">言えなかった分だけもう1周</button>
        </div>
        <p class="say-it-copy-status" aria-live="polite"></p>
      `;
      const missedList = summary.querySelector(".say-it-missed");
      if (missed.length) {
        missed.forEach((q) => {
          const item = document.createElement("li");
          item.textContent = q.question;
          missedList.appendChild(item);
        });
      } else {
        const item = document.createElement("li");
        item.textContent = "なし";
        missedList.appendChild(item);
      }

      const copyText = [
        `【${set.shortTitle || set.title}】`,
        `言えた：${result.said}/${result.total}`,
        "言えなかった問題：",
        ...(missed.length ? missed.map((q, index) => `${index + 1}. ${q.question}`) : ["なし"]),
        "次回：",
        "言えなかった分だけ",
        "もう1周"
      ].join("\n");
      const copyField = summary.querySelector(".say-it-copy");
      copyField.value = copyText;
      const status = summary.querySelector(".say-it-copy-status");
      const copyButton = summary.querySelector('[data-action="copy"]');
      copyButton.addEventListener("click", async () => {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(copyText);
          } else {
            copyField.focus();
            copyField.select();
            document.execCommand("copy");
          }
          status.textContent = "コピーしました。";
        } catch {
          copyField.focus();
          copyField.select();
          status.textContent = "選択した文をコピーしてください。";
        }
      });

      const retryButton = summary.querySelector('[data-action="retry"]');
      retryButton.disabled = !missed.length;
      retryButton.addEventListener("click", () => {
        if (!missed.length) return;
        missed.forEach((q) => {
          const key = answerKey(set.id, q.id);
          delete state.answers[key];
          delete learningState.records[key];
        });
        saveState();
        saveLearningState();
        sayItRetryOnly = true;
        activeQuestionIndex = getFirstUnansweredIndex(set);
        resetQuestionSession();
        render();
        stage.scrollTo({ top: 0, behavior: "smooth" });
      });
      return summary;
    }

    function normalizeBreathLines(value, explicitLines) {
      if (Array.isArray(explicitLines) && explicitLines.length) return explicitLines;
      if (Array.isArray(value)) {
        return value.flatMap((item) => typeof item === "string"
          ? item.split(/(?<=[。！？])\s*/).filter(Boolean)
          : [item]);
      }
      if (!value) return [];
      if (typeof value === "object") return [value];
      return String(value).split(/(?<=[。！？])\s*/).filter(Boolean);
    }

    function renderBreathLines(value, explicitLines) {
      const lines = normalizeBreathLines(value, explicitLines);
      return `<div class="breath-lines">${lines.map((line) => {
        const label = typeof line === "object" ? line.label : "";
        const text = typeof line === "object" ? line.text : line;
        return `<p class="breath-line">${label ? `<span class="breath-label">${label}</span>` : ""}${text || ""}</p>`;
      }).join("")}</div>`;
    }

    function getPaperFrameKey(scope, setId, itemId) {
      return `${scope}::${setId}::${itemId || "default"}`;
    }

    function clearPaperFrameIndexes(scopePrefix, setId) {
      const marker = `::${setId}::`;
      for (const key of paperFrameIndexes.keys()) {
        if (key.startsWith(scopePrefix) && key.includes(marker)) paperFrameIndexes.delete(key);
      }
    }

    function paperText(value) {
      return normalizeBreathLines(value).map((line) => {
        if (typeof line === "object") return `${line.label ? `${line.label} ` : ""}${line.text || ""}`;
        return String(line || "");
      }).join(" ");
    }

    function normalizePaperFrames(frames, fallback) {
      if (Array.isArray(frames) && frames.length) return frames;
      if (fallback?.image) {
        return [{
          order: 1,
          phase: "result",
          phaseLabel: "説明",
          image: fallback.image,
          zoomImage: fallback.zoomImage,
          imageAlt: fallback.imageAlt,
          caption: fallback.caption,
          requiredLabels: []
        }];
      }
      return [];
    }

    function createPaperTheater({ frames, key, title, fallbackImage, fallbackZoomImage, fallbackAlt, fallbackCaption }) {
      const normalizedFrames = normalizePaperFrames(frames, {
        image: fallbackImage,
        zoomImage: fallbackZoomImage,
        imageAlt: fallbackAlt,
        caption: fallbackCaption
      });
      const root = document.createElement("section");
      root.className = "paper-theater";
      root.setAttribute("aria-label", `${title || "説明"} リアル図解紙芝居`);
      if (!normalizedFrames.length) return root;

      const header = document.createElement("div");
      header.className = "paper-theater-header";
      const heading = document.createElement("div");
      const kicker = document.createElement("span");
      kicker.className = "paper-theater-kicker";
      kicker.textContent = "リアル図解紙芝居";
      const phaseTitle = document.createElement("h3");
      phaseTitle.className = "paper-theater-phase";
      phaseTitle.setAttribute("aria-live", "polite");
      heading.append(kicker, phaseTitle);
      const counter = document.createElement("span");
      counter.className = "paper-theater-counter";
      counter.setAttribute("aria-live", "polite");
      header.append(heading, counter);

      const figure = document.createElement("figure");
      figure.className = "paper-theater-figure";
      const imageButton = document.createElement("button");
      imageButton.type = "button";
      imageButton.className = "paper-theater-image";
      imageButton.setAttribute("aria-label", "説明画像を高画質で開く");
      const image = document.createElement("img");
      imageButton.appendChild(image);
      const caption = document.createElement("figcaption");
      caption.className = "paper-theater-caption";
      figure.append(imageButton, caption);

      const labels = document.createElement("div");
      labels.className = "paper-theater-labels";
      labels.setAttribute("aria-label", "場面の要点");

      const controls = document.createElement("div");
      controls.className = "paper-theater-controls";
      const previousButton = document.createElement("button");
      previousButton.type = "button";
      previousButton.textContent = "← 前へ";
      previousButton.setAttribute("aria-label", "前の場面を見る");
      const position = document.createElement("span");
      position.className = "paper-theater-position";
      position.setAttribute("aria-live", "polite");
      const nextButton = document.createElement("button");
      nextButton.type = "button";
      nextButton.textContent = "次へ →";
      nextButton.setAttribute("aria-label", "次の場面を見る");
      controls.append(previousButton, position, nextButton);
      root.append(header, figure, labels, controls);

      let frameIndex = Math.max(0, Math.min(Number(paperFrameIndexes.get(key) || 0), normalizedFrames.length - 1));
      const phaseNames = { what: "何が起きている？", how: "どうする？", why: "なぜ？", result: "結果" };

      function renderFrame() {
        const frame = normalizedFrames[frameIndex] || {};
        const order = Number(frame.order) || frameIndex + 1;
        const phase = frame.phaseLabel || frame.phaseTitle || phaseNames[frame.phase] || frame.title || `第${order}場面`;
        const source = frame.image || fallbackImage || "";
        const zoomSource = frame.zoomImage || source;
        const alt = frame.imageAlt || frame.alt || fallbackAlt || title || "説明画像";
        const frameCaption = paperText(frame.caption || frame.text || fallbackCaption || "");
        const rawLabels = frame.requiredLabels || frame.labels || frame.label || [];
        const labelValues = Array.isArray(rawLabels) ? rawLabels : String(rawLabels).split(/[→>]/);

        phaseTitle.textContent = `${String(order).padStart(2, "0")}　${phase}`;
        counter.textContent = `${frameIndex + 1} / ${normalizedFrames.length}`;
        position.textContent = `${frameIndex + 1} / ${normalizedFrames.length}`;
        image.alt = alt;
        image.src = source;
        caption.textContent = frameCaption;
        caption.hidden = !frameCaption;
        imageButton.onclick = () => openImageViewer(zoomSource, alt, frameCaption);
        labels.replaceChildren();
        labelValues.map((label) => typeof label === "object" ? label.text : label)
          .map((label) => String(label || "").trim())
          .filter(Boolean)
          .forEach((label, index) => {
            if (index) {
              const arrow = document.createElement("b");
              arrow.setAttribute("aria-hidden", "true");
              arrow.textContent = "→";
              labels.appendChild(arrow);
            }
            const item = document.createElement("span");
            item.textContent = label;
            labels.appendChild(item);
          });
        labels.hidden = !labels.children.length;
        previousButton.disabled = frameIndex === 0;
        nextButton.disabled = frameIndex === normalizedFrames.length - 1;
        paperFrameIndexes.set(key, frameIndex);
      }

      previousButton.addEventListener("click", () => {
        if (frameIndex === 0) return;
        frameIndex -= 1;
        renderFrame();
      });
      nextButton.addEventListener("click", () => {
        if (frameIndex >= normalizedFrames.length - 1) return;
        frameIndex += 1;
        renderFrame();
      });
      renderFrame();
      return root;
    }

    function addEvidenceBand(parent, tone, heading, items) {
      if (!items.length) return;
      const section = document.createElement("section");
      section.className = `evidence-band ${tone}`;
      section.innerHTML = `<h3>${heading}</h3><div></div>`;
      const list = section.lastElementChild;
      items.forEach((item, itemIndex) => {
        const row = document.createElement("div");
        row.className = "evidence-row";
        row.dataset.visualItem = tone;
        row.innerHTML = `<strong>${item.title || item.term || ""}</strong>`;
        if (Array.isArray(item.frames) && item.frames.length) {
          row.classList.add("has-paper-theater");
          const theater = createPaperTheater({
            frames: item.frames,
            key: getPaperFrameKey(`evidence-${tone}`, activeSetId, item.id || item.title || itemIndex),
            title: item.title || "重要な説明",
            fallbackImage: item.teachingImage,
            fallbackZoomImage: item.teachingZoomImage,
            fallbackAlt: item.teachingImageAlt || item.title || "説明画像",
            fallbackCaption: item.teachingImageCaption || ""
          });
          theater.classList.add("evidence-paper-theater");
          row.appendChild(theater);

    function renderEvidence(set) {
      stage.classList.remove("lab-active");

      const titleLines = normalizeBreathLines(set.title, set.titleLines);

      if (set.articleFocus) {

        if (Array.isArray(set.articleFocus.frames) && set.articleFocus.frames.length) {
          const theater = createPaperTheater({
            frames: set.articleFocus.frames,

      const normalizeArticleEvidence = (articleEvidence) => {
        if (Array.isArray(articleEvidence)) return articleEvidence;

      const articleEvidenceItems = normalizeArticleEvidence(set.articleEvidence);
      if (articleEvidenceItems.length) {

          button.addEventListener("click", () => openImageViewer(
            item.zoomImage || item.image,

          ));
          evidenceGrid.appendChild(figure);
        });

        stageInner.appendChild(evidence);

      addEvidenceBand(stageInner, "red", set.curiosityTitle || "赤：気になる原理", Array.isArray(set.curiosityPoints) ? set.curiosityPoints : []);

    function updateDock(set) {
      const inRecall = activeMode === "recall";
      const sayIt = isSayItSet(set);
      const appShell = document.querySelector(".app-shell");
      appShell.classList.toggle("say-it-mode", inRecall && sayIt);
      confidenceControl.style.display = inRecall && !sayIt ? "" : "none";
      confidenceControl.style.visibility = inRecall && !answerRevealed && !sayIt ? "visible" : "hidden";
      revealButton.style.visibility = inRecall ? "visible" : "hidden";
      confidenceButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.confidence === selectedConfidence);
        button.disabled = !inRecall || answerRevealed;
      });
      revealButton.disabled = !inRecall || answerRevealed || !Number.isInteger(selectedChoice) || (!sayIt && !selectedConfidence);
      revealButton.textContent = answerRevealed ? "回答済み" : "答えを見る";
      const order = getReviewQuestionIndexes(set);
      const position = Math.max(0, order.indexOf(activeQuestionIndex));
      backButton.disabled = position === 0;
      nextButton.disabled = inRecall && !answerRevealed;
      nextButton.textContent = position === order.length - 1 ? "先頭へ" : "次へ →";
    }

    function render() {
      const set = getActiveSet();
      if (!set) {
        stageInner.innerHTML = '<div class="empty-stage">研究データを読み込めませんでした。</div>';
        return;
      }
      renderHeader(set);
      renderSetList();
      const activeLens = activeMode === "recall"
        ? (answerRevealed ? "principle" : "observation")
        : ({ evidence: "principle", lab: "verification" }[activeMode] || "observation");
      learningLens.querySelectorAll(".learning-lens").forEach((lens) => {
        lens.classList.toggle("active", lens.dataset.lens === activeLens);
      });
      document.querySelector(".app-shell").classList.toggle("lab-mode", activeMode === "lab");
      modeTabs.forEach((button) => {
        const active = button.dataset.mode === activeMode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
      if (activeMode === "recall") renderRecall(set);
      if (activeMode === "evidence") renderEvidence(set);
      if (activeMode === "lab") renderLab(set);
      updateDock(set);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next.toISOString();
    }

    function showResultFlash(outcome, principle, sayIt = false) {
      window.clearTimeout(resultFlashTimer);
      const positive = sayIt ? outcome === 1 : outcome;
      resultFlash.className = `result-flash ${positive ? "correct" : "wrong"}`;
      resultFlashMark.textContent = sayIt ? (positive ? "○" : "×") : (positive ? "✓" : "×");
      resultFlashText.textContent = sayIt ? (positive ? "言えた" : "言えなかった") : (positive ? "正解！" : "不正解");
      resultFlashPrinciple.textContent = principle;
      resultFlash.hidden = false;
      void resultFlash.offsetWidth;
      resultFlash.classList.add("playing");
      resultFlashTimer = window.setTimeout(() => {
        resultFlash.hidden = true;
        resultFlash.classList.remove("playing");
        stage.querySelector(".answer-panel")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }, 900);
    }

    function revealCurrentAnswer() {
      const set = getActiveSet();
      const q = set?.questions?.[activeQuestionIndex];
      const sayIt = isSayItSet(set);
      if (!q || !Number.isInteger(selectedChoice) || (!sayIt && !selectedConfidence) || answerRevealed) return;
      const key = answerKey(set.id, q.id);
      const now = new Date();
      const said = selectedChoice === 1;
      const correct = sayIt ? said : selectedChoice === q.correctIndex;
      const confidence = sayIt ? (said ? "certain" : "unsure") : selectedConfidence;
      const previous = learningState.records[key] || {};
      const previousAttempts = Array.isArray(previous.attempts) ? previous.attempts : [];
      const consecutiveCorrectCount = correct ? (previous.consecutiveCorrectCount || 0) + 1 : 0;
      const intervalDays = correct ? ({ unsure: 1, maybe: 3, certain: 7 }[confidence] || 1) * Math.max(1, consecutiveCorrectCount) : 1;
      const highConfidenceError = !correct && confidence === "certain";
      const record = {
        confidence,
        responseTimeMs: Math.max(0, Date.now() - questionStartedAt),
        hintUsed: false,
        retrySuccess: Boolean(correct && previous.highConfidenceError),
        lastReviewedDate: now.toISOString(),
        dueDate: addDays(now, intervalDays),
        consecutiveCorrectCount,
        highConfidenceError,
        attempts: previousAttempts.concat({ selectedIndex: selectedChoice, said: sayIt ? said : undefined, correct, confidence, reviewedAt: now.toISOString() }).slice(-12)
      };
      if (sayIt) record.responseMode = "say-it";
      state.answers[key] = selectedChoice;
      learningState.records[key] = record;
      saveState();
      saveLearningState();
      answerRevealed = true;
      render();
      showResultFlash(sayIt ? selectedChoice : correct, q.principle || q.answerTitle.replace(/^答え[：:]\s*/, ""), sayIt);
    }

    function moveQuestion(direction) {
      const set = getActiveSet();
      const order = getReviewQuestionIndexes(set);
      if (!order.length) return;
      const position = Math.max(0, order.indexOf(activeQuestionIndex));
      const nextPosition = (position + direction + order.length) % order.length;
      setActiveQuestion(order[nextPosition]);
    }

    function openShelf() {
      researchShelf.classList.add("open");
      researchShelf.setAttribute("aria-hidden", "false");
      drawerScrim.hidden = false;
      document.body.classList.add("drawer-open");
      shelfCloseButton.focus();
    }

    function closeShelf() {
      researchShelf.classList.remove("open");
      researchShelf.setAttribute("aria-hidden", "true");
      drawerScrim.hidden = true;
      document.body.classList.remove("drawer-open");
    }

    function updateViewerScale() {
      const naturalWidth = imageViewerImage.naturalWidth || 1200;
      imageViewerImage.style.width = `${Math.max(320, Math.round(naturalWidth * viewerScale))}px`;
      imageViewerTitle.textContent = `高画質画像 ${Math.round(viewerScale * 100)}%`;
    }

    function fitViewerImage() {
      const naturalWidth = imageViewerImage.naturalWidth || 1200;
      const naturalHeight = imageViewerImage.naturalHeight || 800;
      const fitWidth = (imageViewerStage.clientWidth - 32) / naturalWidth;
      const fitHeight = (imageViewerStage.clientHeight - 70) / naturalHeight;
      viewerScale = Math.max(.18, Math.min(fitWidth, fitHeight, 1));
      updateViewerScale();
      imageViewerStage.scrollTo({ top: 0, left: 0 });
    }

    function openImageViewer(src, alt, caption) {
      viewerScale = 1;
      imageViewerImage.src = src;
      imageViewerImage.alt = alt;
      imageViewerCaption.innerHTML = renderBreathLines(caption || "");
      imageViewer.hidden = false;
      document.body.classList.add("viewer-open");
      imageViewerImage.onload = fitViewerImage;
      updateViewerScale();
      viewerCloseButton.focus();
    }

    function closeImageViewer() {
      imageViewer.hidden = true;
      document.body.classList.remove("viewer-open");
      imageViewerImage.removeAttribute("src");
    }

    shelfOpenButton.addEventListener("click", openShelf);
    shelfCloseButton.addEventListener("click", closeShelf);
    drawerScrim.addEventListener("click", closeShelf);
    modeTabs.forEach((button) => button.addEventListener("click", () => setMode(button.dataset.mode)));
    confidenceButtons.forEach((button) => button.addEventListener("click", () => { selectedConfidence = button.dataset.confidence; updateDock(getActiveSet()); }));
    revealButton.addEventListener("click", revealCurrentAnswer);
    backButton.addEventListener("click", () => moveQuestion(-1));
    nextButton.addEventListener("click", () => moveQuestion(1));

    resetButton.addEventListener("click", () => {
      const set = getActiveSet();
      if (!set || !window.confirm(`「${set.shortTitle || set.title}」の回答と学習記録をリセットしますか？`)) return;
      set.questions.forEach((q) => {
        const key = answerKey(set.id, q.id);
        delete state.answers[key];
        delete learningState.records[key];
      });
      saveState();
      saveLearningState();
      activeQuestionIndex = 0;
      sayItRetryOnly = false;
      resetQuestionSession();
      closeShelf();
      render();
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.classList.add("show");
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.classList.remove("show");
    });

    viewerFitButton.addEventListener("click", fitViewerImage);
    viewerActualButton.addEventListener("click", () => { viewerScale = 1; updateViewerScale(); });
    viewerZoomOutButton.addEventListener("click", () => { viewerScale = Math.max(.18, viewerScale / 1.35); updateViewerScale(); });
    viewerZoomInButton.addEventListener("click", () => { viewerScale = Math.min(4, viewerScale * 1.35); updateViewerScale(); });
    viewerCloseButton.addEventListener("click", closeImageViewer);
    imageViewer.addEventListener("click", (event) => { if (event.target === imageViewer) closeImageViewer(); });
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!imageViewer.hidden) closeImageViewer();
      else if (researchShelf.classList.contains("open")) closeShelf();
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", async () => {
        const reloadKey = "nikkan-sw-reloaded-v54";
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (sessionStorage.getItem(reloadKey)) return;
          sessionStorage.setItem(reloadKey, "1");
          location.reload();
        });
        try {
          const registration = await navigator.serviceWorker.register("./service-worker.js?v=63");
          try {
            await registration?.update?.();
          } catch (error) {
            console.warn("Service Worker update skipped.", error);
          }
        } catch (error) {
          console.warn("Service Worker registration skipped.", error);
        }
      });
    }

    resetQuestionSession();
    render();
  </script>
